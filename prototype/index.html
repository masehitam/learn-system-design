<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alur</title>
<meta name="description" content="Belajar system design lewat animasi dan playground">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#EBEEF2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#EBEEF2; --surface:#FFFFFF; --sunk:#DFE4EA; --ink:#17202B; --ink-2:#566274; --rule:#D2D8E0; --edge:#B4BDC9; --dot:#CDD3DB;
  --focus:#2B6CE0;
  --c-fondasi:#2B6CE0; --c-jaringan:#8350E8; --c-storage:#0C9682; --c-cache:#D48C06; --c-msg:#DB4157; --c-scale:#3A963A; --c-case:#5B6472;
  --ok:#2E9E5B; --warn:#D48C06; --bad:#D63A4E;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --t-fast:120ms; --t-med:220ms; --ease:cubic-bezier(.2,.7,.2,1);
  --font:"Overpass",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Overpass Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#0E131A; --surface:#161D26; --sunk:#1F2833; --ink:#E6EBF1; --ink-2:#98A4B5; --rule:#28323F; --edge:#3D4959; --dot:#242D39; --focus:#6B9BFF;
  --c-fondasi:#5B8EF5; --c-jaringan:#A07CF7; --c-storage:#2BB7A1; --c-cache:#F0AA2A; --c-msg:#F06478; --c-scale:#5CB85C; --c-case:#8D97A6;
  --ok:#4CC27E; --warn:#F0AA2A; --bad:#F2596B; color-scheme:dark;
}}
:root[data-theme=dark]{
  --paper:#0E131A; --surface:#161D26; --sunk:#1F2833; --ink:#E6EBF1; --ink-2:#98A4B5; --rule:#28323F; --edge:#3D4959; --dot:#242D39; --focus:#6B9BFF;
  --c-fondasi:#5B8EF5; --c-jaringan:#A07CF7; --c-storage:#2BB7A1; --c-cache:#F0AA2A; --c-msg:#F06478; --c-scale:#5CB85C; --c-case:#8D97A6;
  --ok:#4CC27E; --warn:#F0AA2A; --bad:#F2596B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:400 15px/1.6 var(--font);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,fieldset{margin:0;padding:0}
fieldset{border:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:4px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-999px;top:8px;z-index:99;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:var(--r-s)}
.skip:focus{left:8px}

/* Shell */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);grid-template-rows:64px auto;min-height:100vh}
.top{grid-column:1/-1;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--rule)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:23px;letter-spacing:-.02em;text-decoration:none;min-width:140px}
.logo svg{width:30px;height:30px}
.search{flex:1;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 14px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);color:var(--ink-2)}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in oklab,var(--focus) 22%,transparent)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
kbd{font:500 12px var(--mono);border:1px solid var(--rule);border-radius:5px;padding:1px 7px;color:var(--ink-2)}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:none;cursor:pointer;color:var(--ink);transition:background var(--t-fast)}
.ib:hover{background:var(--sunk)}
.rail{grid-row:2;position:sticky;top:64px;height:calc(100vh - 64px);display:flex;flex-direction:column;gap:4px;padding:12px 8px}
.rail a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border-radius:var(--r-m);font-size:11.5px;font-weight:600;color:var(--ink-2);text-decoration:none;transition:background var(--t-fast)}
.rail a:hover{background:var(--sunk)}
.rail a[aria-current=page]{background:var(--surface);color:var(--ink)}
main{grid-row:2;min-width:0;padding:24px 28px 96px}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:60px auto}
  .top{padding:0 12px 0 16px;gap:10px}
  .logo{min-width:0} .search kbd{display:none}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;z-index:30;flex-direction:row;justify-content:space-around;padding:4px 6px calc(4px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--rule)}
  .rail a{flex:1;padding:6px 2px}
  main{grid-column:1;padding:18px 16px 96px}
}
@media (max-width:480px){.logo span{display:none}}

/* Buttons, chips, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background var(--t-fast),color var(--t-fast)}
.btn:hover{background:var(--sunk)}
.btn .ico{width:18px;height:18px}
.btn.pri,.btn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.pri:hover,.btn[aria-pressed=true]:hover{background:color-mix(in oklab,var(--ink) 84%,var(--paper))}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--sunk);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background var(--t-fast)}
.chip:hover{background:color-mix(in oklab,var(--sunk) 70%,var(--ink) 8%)}
.chip[data-line]::before{content:"";width:14px;height:5px;border-radius:3px;background:var(--cat)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.seg-ctl{display:inline-flex;padding:3px;border-radius:999px;background:var(--sunk);flex:none;max-width:100%;overflow-x:auto;scrollbar-width:none}
#mg-msg:empty{display:none}
.seg-ctl button{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:0;border-radius:999px;background:none;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg-ctl button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.lv{width:14px;height:14px;flex:none}
select,input[type=text],textarea{border:1px solid var(--rule);border-radius:var(--r-s);background:var(--surface);padding:7px 10px}
textarea{width:100%;resize:vertical;line-height:1.5}
input[type=range]{accent-color:var(--ink);width:100%}
.lbl-s{font-size:13px;font-weight:700;color:var(--ink-2)}

/* Home */
.hero{display:grid;gap:16px;margin-bottom:30px}
.hero-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.hero h1{font-size:clamp(28px,3.4vw,42px);line-height:1.08;font-weight:800;letter-spacing:-.025em}
.hero-head p{color:var(--ink-2);max-width:54ch;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.map-wrap{background:var(--surface);border-radius:var(--r-l);overflow-x:auto;overscroll-behavior-x:contain}
.map{display:block;width:100%;min-width:860px;height:auto}
.mline{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.map text{font:600 11.5px var(--font);fill:var(--ink-2);text-anchor:middle}
.map .mname{font-size:13px;font-weight:800;fill:var(--ink);text-anchor:start}
.map .mstart{text-anchor:middle}
.map a{outline:none;cursor:pointer}
.map .hit{fill:transparent}
.map a:hover text,.map a:focus-visible text{fill:var(--ink)}
.map a:focus-visible .hit{stroke:var(--focus);stroke-width:2.5}
.map .st.done text{fill:var(--ink);font-weight:800}
.origin{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.train{fill:var(--surface);stroke-width:2.5}
.filters{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.filters .chips{flex:1 1 420px;min-width:0}
.count{font-size:13.5px;color:var(--ink-2);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:30px 20px}
.card{position:relative;content-visibility:auto;contain-intrinsic-size:auto 290px}
.thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:var(--r-m);overflow:hidden;contain:paint}
.thumb,.stage-wrap,.cv-wrap{background-color:color-mix(in oklab,var(--cat,var(--c-case)) 7%,var(--surface));background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:12px 12px}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.dur{position:absolute;left:8px;top:8px;padding:1px 7px;border-radius:5px;background:rgb(14 19 26 / .84);color:#fff;font-size:12px;font-weight:700}
.prog{position:absolute;left:0;bottom:0;width:100%;height:4px;background:var(--cat);transform-origin:left;transform:scaleX(var(--p))}
.meta{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:12px;padding-top:12px}
.card-line{border-radius:3px;background:var(--cat)}
.card h3{font-size:16px;line-height:1.35;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card h3 a{text-decoration:none}
.card h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:4px;color:var(--ink-2);font-size:13.5px}
.sub .lvl{display:inline-flex;align-items:center;gap:5px}
.save{width:36px;height:36px;margin:-6px -6px 0 0;border-radius:50%;border:0;background:none;color:var(--ink-2);cursor:pointer;opacity:0;transition:opacity var(--t-fast)}
.card:hover .save,.save:focus-visible,.save[aria-pressed=true]{opacity:1}
.save[aria-pressed=true] .ico,[data-save][aria-pressed=true] .ico{fill:currentColor}
@media (hover:none){.save{opacity:1}}
.empty{grid-column:1/-1;display:grid;justify-items:start;gap:12px;padding:40px 0;color:var(--ink-2);max-width:52ch}
.page-head{margin-bottom:24px}
.page-head h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.page-head p{color:var(--ink-2);margin-top:4px;max-width:60ch}

/* Diagram (thumbnail + player) */
.edge{stroke:var(--edge);stroke-width:1.6;transition:stroke var(--t-med)}
.stage .edge.on{stroke:var(--ink-2)}
.edge.cut{stroke:var(--bad);stroke-dasharray:4 4}
.node{transition:opacity var(--t-med)}
.node .shape{fill:color-mix(in oklab,var(--tc) 13%,var(--surface));stroke:var(--tc);stroke-width:1.6;transition:fill var(--t-med),stroke-width var(--t-med)}
.node .slots{stroke:var(--tc);stroke-width:1.4}
.node text{font-family:var(--font);font-size:9.5px;font-weight:700;fill:var(--ink);text-anchor:middle}
.node.hl .shape{fill:color-mix(in oklab,var(--tc) 34%,var(--surface));stroke-width:2.6}
.node.down{opacity:.3}
.pk,.pp{fill:var(--ink)}
.pk.bad,.pp.bad{fill:var(--bad)}
.pk{animation:pk 1.6s linear infinite paused;transform:translate(var(--x1),var(--y1))}
.pk.bad{animation-name:pkbad}
@keyframes pk{from{transform:translate(var(--x1),var(--y1))}to{transform:translate(var(--x2),var(--y2))}}
@keyframes pkbad{from{transform:translate(var(--x1),var(--y1));opacity:1}60%{opacity:1}to{transform:translate(var(--x2),var(--y2));opacity:0}}
.card:hover .pk,.card:focus-within .pk,.next-item:hover .pk,.next-item:focus-visible .pk,.live .pk{animation-play-state:running}

/* Lesson */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;max-width:1480px}
@media (max-width:1120px){.watch{grid-template-columns:minmax(0,1fr)}}
.player{border-radius:var(--r-l);overflow:hidden;background:var(--surface)}
.player:focus-visible{outline-offset:3px;border-radius:var(--r-l)}
.stage-wrap{aspect-ratio:16/9}
.stage{display:block;width:100%;height:100%}
.cap{display:grid;gap:2px;padding:14px 20px 4px;min-height:84px}
.cap b{font-size:18px;line-height:1.3}
.cap span{color:var(--ink-2);max-width:72ch}
.ctrl{display:flex;align-items:center;gap:4px;padding:6px 10px 10px}
.tl{flex:1;display:flex;gap:4px;align-items:center;height:28px;margin:0 8px;min-width:80px}
.seg{position:relative;flex:1;height:6px;padding:0;border:0;border-radius:3px;background:var(--rule);overflow:hidden;cursor:pointer;transition:transform var(--t-fast)}
.seg:hover{transform:scaleY(1.7)}
.seg i{position:absolute;inset:0;background:var(--cat);transform-origin:left;transform:scaleX(0)}
.time{font-size:13px;color:var(--ink-2);min-width:76px;text-align:right}
.spd{font-weight:700;font-size:13px;width:48px;border-radius:999px}
.w-title{font-size:clamp(22px,2.4vw,28px);line-height:1.2;font-weight:800;letter-spacing:-.015em;margin:18px 0 10px}
.w-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.w-bar .sub{margin:0}
.line-tag{display:inline-flex;align-items:center;gap:7px;font-weight:700;color:var(--ink)}
.line-tag::before{content:"";width:16px;height:5px;border-radius:3px;background:var(--cat)}
.w-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:24px 0 18px;overflow-x:auto}
.tab{flex:none;border:0;background:none;padding:10px 14px;font-weight:700;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--cat)}
.prose{max-width:70ch}
.prose .lead{font-size:17px;line-height:1.6}
.prose h2{font-size:17px;font-weight:800;margin:26px 0 8px}
.prose ul{padding-left:20px;display:grid;gap:6px}
.steps{list-style:none;display:grid;gap:4px}
.steps button{display:grid;grid-template-columns:52px 1fr;gap:2px 12px;width:100%;padding:10px 12px;border:0;border-radius:var(--r-m);background:none;text-align:left;cursor:pointer}
.steps button:hover{background:var(--sunk)}
.steps button[aria-current=step]{background:var(--surface)}
.steps .num{grid-row:span 2;color:var(--ink-2);font-size:13px;padding-top:2px}
.steps span:last-child{color:var(--ink-2)}
.quiz{display:grid;gap:14px;max-width:62ch}
.quiz legend{font-weight:700;font-size:17px;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--rule);border-radius:var(--r-m);background:var(--surface);cursor:pointer;margin-bottom:8px}
.opt:has(input:checked){border-color:var(--ink)}
.opt input{margin-top:5px;accent-color:var(--ink)}
.qres{font-weight:700;min-height:1.6em}
.qres.ok{color:var(--ok)} .qres.no{color:var(--bad)}
.quiz .btn{justify-self:start}
.quiz fieldset{border:0;padding:0;margin:0}.q-from{display:inline-block;font-size:13px;color:var(--ink-2);margin:-4px 0 10px}
.review .quiz{max-width:62ch}.quiz legend .num{color:var(--ink-2);margin-right:4px}
.qexp{font-size:14px;margin-top:2px}.qexp:empty{display:none}
.quiz fieldset.ok .qexp{color:var(--ok)}.quiz fieldset.no .qexp{color:var(--bad)}
.quiz fieldset.no .opt:has(input:checked){border-color:var(--bad)}.quiz fieldset.ok .opt:has(input:checked){border-color:var(--ok)}
.mynotes{display:grid;gap:10px;max-width:62ch}
.mynotes .btn{justify-self:start}
.note-list{list-style:none;display:grid;gap:8px;margin-top:8px}
.note-list li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:10px 12px;background:var(--surface);border-radius:var(--r-m)}
.note-list .tlink{border:0;background:var(--sunk);border-radius:5px;padding:2px 8px;font-size:13px;font-weight:700;cursor:pointer}
.muted{color:var(--ink-2)}
.next h2{font-size:16px;font-weight:800;margin-bottom:12px}
.next-list{display:grid;gap:12px}
.next-item{display:grid;grid-template-columns:168px minmax(0,1fr);gap:12px;text-decoration:none;border-radius:var(--r-m)}
.next-item .thumb{border-radius:8px}
.next-item b{font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.next-item .sub{font-size:12.5px;gap:2px 10px}
.next-item:hover b{text-decoration:underline;text-underline-offset:3px}

/* Playground */
.pg-bar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:18px 0 16px}
#pg-chal{width:100%;max-width:100%}
#pg-share-msg{flex-basis:100%;font-size:13.5px}#pg-share-msg:empty{display:none}
.fld{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.fld.rps{flex:1 1 300px;max-width:440px}
.fld output{min-width:86px;font-weight:800}
.fld-col{display:grid;gap:6px;font-size:13.5px;font-weight:600;margin-top:14px}
.fld-col output{font-weight:800;justify-self:end;margin-top:-26px}
.pg-body{display:grid;grid-template-columns:176px minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1180px){.pg-body{grid-template-columns:minmax(0,1fr)}.palette{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.palette .lbl-s{grid-column:1/-1}}
.palette{display:grid;gap:6px}
.pal{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--rule);border-radius:var(--r-m);background:var(--surface);text-align:left;cursor:pointer;transition:background var(--t-fast)}
.pal:hover{background:var(--sunk)}
.pal svg{width:44px;height:20px}
.pal b{display:block;font-size:13.5px;line-height:1.2}
.pal small{color:var(--ink-2);font-size:11.5px}
.cv-wrap{position:relative;border-radius:var(--r-l);overflow:hidden}
.cv-wrap canvas{display:block;width:100%;touch-action:none;cursor:grab}
.cv-wrap canvas.connecting{cursor:crosshair}
.cv-hint{position:absolute;left:12px;bottom:10px;right:12px;font-size:13px;color:var(--ink-2);pointer-events:none}
.side{display:grid;gap:12px}
.panel{background:var(--surface);border-radius:var(--r-l);padding:16px}
.panel h2{font-size:15px;font-weight:800;margin-bottom:10px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric b{display:block;font-size:22px;line-height:1.2;font-weight:800}
.metric span{font-size:12.5px;color:var(--ink-2)}
.metric.bad b{color:var(--bad)}
.advice{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);font-size:13.5px}
.checks{list-style:none;display:grid;gap:6px;margin-top:10px;font-size:13.5px}
.checks li{display:flex;gap:8px;align-items:center}
.checks .ico{width:16px;height:16px}
.checks .pass{color:var(--ok)} .checks .fail{color:var(--bad)} .checks .todo{color:var(--ink-2)}
.small{font-size:13px} .mono{font-family:var(--mono)}
.lab-tabs{margin:-6px 0 18px}
.seg-ctl a{flex:none;display:inline-flex;align-items:center;height:30px;padding:0 16px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-2);text-decoration:none}
.seg-ctl a[aria-current=page]{background:var(--surface);color:var(--ink)}
.lab-body{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1000px){.lab-body{grid-template-columns:minmax(0,1fr)}}
.term{display:grid;gap:12px}.term h2{margin-bottom:0}

  {id:'f1',cat:'fondasi',t:'Apa itu system design?',s:'Pengantar',lv:0,min:6,dg:'web',d:'Gambaran besar perjalanan sebuah request: dari browser, ke server, ke database, lalu kembali lagi. Semua topik lain adalah variasi dari alur ini.',p:['System design adalah memilih komponen dan cara mereka berkomunikasi untuk memenuhi kebutuhan fungsional dan non-fungsional.','Kebutuhan non-fungsional seperti latensi, ketersediaan, dan biaya biasanya yang menentukan arsitektur.','Mulai dari desain paling sederhana, lalu tambah komponen hanya saat ada bottleneck yang jelas.'],qz:[{"q": "Apa yang paling sering menentukan bentuk arsitektur sebuah sistem?", "o": ["Bahasa pemrograman yang dipakai tim", "Kebutuhan non-fungsional seperti latensi, ketersediaan, dan biaya", "Jumlah halaman di aplikasi"], "a": 1, "e": "Fitur bisa dibangun dengan banyak arsitektur. Target latensi, ketersediaan, dan biaya yang mempersempit pilihannya."}, {"q": "Kapan sebaiknya menambah komponen baru seperti cache atau queue?", "o": ["Sejak hari pertama, agar siap untuk skala besar", "Saat ada bottleneck atau kebutuhan yang jelas", "Setiap kali jumlah user naik dua kali lipat"], "a": 1, "e": "Setiap komponen menambah biaya dan hal yang bisa rusak. Tambahkan saat ada masalah nyata yang diselesaikannya."}, {"q": "Pada arsitektur browser, satu web server, dan satu database, apa yang terjadi jika web server mati?", "o": ["Request dialihkan ke database", "Seluruh layanan tidak bisa diakses", "Browser melayani dari cache selamanya"], "a": 1, "e": "Tanpa server cadangan, satu server adalah single point of failure."}, {"q": "Mana yang termasuk kebutuhan fungsional?", "o": ["User bisa mengunggah foto profil", "Halaman terbuka di bawah 200 ms", "Layanan aktif 99,9% waktu"], "a": 0, "e": "Kebutuhan fungsional adalah apa yang dilakukan sistem. Kecepatan dan ketersediaan adalah kebutuhan non-fungsional."}]},
  {id:'f2',cat:'fondasi',t:'Latensi vs throughput',s:'Latensi',lv:0,min:8,dg:'web',d:'Latensi adalah berapa lama satu request selesai. Throughput adalah berapa banyak request selesai per detik. Keduanya sering saling tarik.',p:['Latensi diukur per request dan biasanya dilaporkan sebagai p50, p95, dan p99.','Throughput naik dengan paralelisme, tapi antrean yang memanjang menaikkan latensi.','Saat utilisasi mendekati 100%, latensi melonjak tajam, bukan naik perlahan.'],qz:[{"q": "Latensi p99 sebesar 800 ms berarti...", "o": ["Rata-rata request selesai dalam 800 ms", "99% request selesai dalam 800 ms atau kurang", "99 request per detik selesai dalam 800 ms"], "a": 1, "e": "Persentil melihat distribusi. p99 menunjukkan pengalaman 1% request paling lambat."}, {"q": "Server bekerja di 95% kapasitas. Apa yang biasanya terjadi pada latensi?", "o": ["Tetap sama seperti saat 50%", "Naik tajam karena antrean memanjang", "Turun karena server sudah \"panas\""], "a": 1, "e": "Mendekati 100% utilisasi, antrean tumbuh cepat sehingga latensi melonjak, bukan naik perlahan."}, {"q": "Cara paling langsung menaikkan throughput layanan yang stateless adalah...", "o": ["Menambah server yang memproses secara paralel", "Memperbesar ukuran response", "Menurunkan TTL DNS"], "a": 0, "e": "Lebih banyak pekerja paralel berarti lebih banyak request selesai per detik."}, {"q": "Kenapa rata-rata latensi saja tidak cukup untuk memantau layanan?", "o": ["Rata-rata selalu lebih tinggi dari p99", "Rata-rata bisa terlihat bagus walau sebagian user mengalami request sangat lambat", "Rata-rata tidak bisa dihitung untuk HTTP"], "a": 1, "e": "Beberapa request yang sangat lambat tenggelam dalam rata-rata. Karena itu dipantau juga p95 dan p99."}]},
  {id:'f3',cat:'fondasi',t:'Scaling vertikal vs horizontal',s:'Scaling',lv:0,min:9,dg:'lb',d:'Vertikal berarti mesin lebih besar. Horizontal berarti mesin lebih banyak. Pelajari kapan masing-masing masuk akal.',p:['Scaling vertikal sederhana, tapi punya batas fisik dan tetap satu titik gagal.','Scaling horizontal butuh load balancer dan server yang stateless.','Simpan state seperti sesi dan file di luar server agar server mudah ditambah atau dibuang.'],qz:[{"q": "Apa kelemahan utama scaling vertikal?", "o": ["Butuh load balancer", "Ada batas ukuran mesin dan tetap satu titik gagal", "Server harus stateless"], "a": 1, "e": "Mesin terbesar pun punya batas, dan jika mesin itu mati, layanan ikut mati."}, {"q": "Kenapa server perlu stateless untuk scaling horizontal?", "o": ["Agar request mana pun bisa dilayani server mana pun", "Agar server tidak butuh database", "Agar server bisa memakai lebih banyak RAM"], "a": 0, "e": "Jika sesi disimpan di satu server, request user itu terikat ke server tersebut dan sulit dipindah."}, {"q": "Di mana sebaiknya data sesi user disimpan agar server mudah ditambah dan dibuang?", "o": ["Di memori masing-masing server", "Di store bersama seperti Redis atau database", "Di file log server"], "a": 1, "e": "Store bersama membuat semua server bisa membaca sesi yang sama."}, {"q": "Komponen apa yang hampir selalu dibutuhkan untuk scaling horizontal web server?", "o": ["Load balancer", "Message queue", "CDN"], "a": 0, "e": "Load balancer membagi request ke server-server yang identik."}]},
  {id:'f4',cat:'fondasi',t:'Estimasi kapasitas',s:'Estimasi',lv:1,min:12,dg:'web',d:'Hitungan kasar dari jumlah user aktif menjadi request per detik, kebutuhan storage, dan bandwidth.',p:['Satu juta request per hari kira-kira 12 request per detik rata-rata.','Rencanakan untuk puncak, biasanya 2 sampai 10 kali rata-rata.','Bulatkan angka dengan berani; tujuannya urutan besaran, bukan presisi.'],qz:[{"q": "Kira-kira berapa request per detik rata-rata dari 1 juta request per hari?", "o": ["Sekitar 1", "Sekitar 12", "Sekitar 1.000"], "a": 1, "e": "Satu hari kira-kira 86.400 detik. 1.000.000 dibagi 86.400 hasilnya sekitar 12."}, {"q": "Rata-rata trafik 50 rps. Kapasitas berapa yang wajar direncanakan?", "o": ["50 rps tepat", "Sekitar 100 sampai 500 rps untuk menampung puncak", "5 rps karena sebagian besar waktu sepi"], "a": 1, "e": "Trafik puncak biasanya 2 sampai 10 kali rata-rata, jadi rencanakan untuk puncak."}, {"q": "10 juta user masing-masing menyimpan 1 MB. Berapa total storage kira-kira?", "o": ["10 GB", "10 TB", "10 PB"], "a": 1, "e": "10.000.000 × 1 MB = 10.000.000 MB, kira-kira 10 TB."}, {"q": "Apa tujuan estimasi kapasitas di awal desain?", "o": ["Mendapat angka yang presisi sampai satuan", "Mengetahui urutan besaran agar pilihan arsitektur masuk akal", "Menentukan harga langganan"], "a": 1, "e": "Yang penting adalah tahu apakah kebutuhannya ratusan, ribuan, atau jutaan, bukan angka pastinya."}]},
  {id:'n1',cat:'jaringan',t:'Bagaimana DNS bekerja',s:'DNS',lv:0,min:8,dg:'dns',d:'Mengikuti satu pertanyaan “berapa IP alamat ini?” dari browser sampai name server, lengkap dengan caching di setiap lapisan.',p:['Resolver bertanya ke root, lalu TLD, lalu name server secara berurutan.','Setiap jawaban disimpan sesuai TTL sehingga query berikutnya jauh lebih cepat.','TTL pendek memudahkan migrasi, TTL panjang mengurangi beban dan latensi.'],qz:[{"q": "Saat tidak ada di cache, ke mana resolver bertanya lebih dulu?", "o": ["Name server otoritatif domain", "Root server", "Server web tujuan"], "a": 1, "e": "Urutannya root, lalu server TLD (misalnya .com), lalu name server otoritatif."}, {"q": "Apa fungsi TTL pada record DNS?", "o": ["Menentukan berapa lama jawaban boleh disimpan di cache", "Mengenkripsi query DNS", "Membatasi jumlah request per detik"], "a": 0, "e": "Selama TTL belum habis, resolver dan browser memakai jawaban yang tersimpan."}, {"q": "Kamu akan memindahkan situs ke server baru minggu depan. Apa yang sebaiknya dilakukan pada TTL?", "o": ["Turunkan TTL beberapa hari sebelumnya", "Naikkan TTL setinggi mungkin", "Hapus record DNS sementara"], "a": 0, "e": "TTL pendek membuat alamat baru cepat menyebar setelah record diganti."}, {"q": "Kenapa query DNS kedua untuk domain yang sama biasanya jauh lebih cepat?", "o": ["Domainnya sudah terdaftar", "Jawabannya diambil dari cache resolver atau browser", "Root server mengingat IP-mu"], "a": 1, "e": "Caching di setiap lapisan menghindari perjalanan penuh ke root, TLD, dan name server."}]},
  {id:'n2',cat:'jaringan',t:'Load balancer L4 vs L7',s:'Load balancer',lv:1,min:11,dg:'lb',d:'Load balancer membagi trafik ke banyak server. L4 melihat IP dan port, L7 bisa membaca isi HTTP seperti path dan header.',p:['Algoritma umum: round robin, least connections, dan hash berdasarkan IP.','Health check menjauhkan trafik dari server yang sakit secara otomatis.','L7 memungkinkan routing per path, tapi lebih mahal secara komputasi daripada L4.'],qz:[{"q": "Load balancer mana yang bisa mengarahkan /api ke layanan berbeda dari /gambar?", "o": ["L4, karena membaca IP dan port", "L7, karena membaca isi HTTP seperti path", "Keduanya sama saja"], "a": 1, "e": "Path adalah bagian dari HTTP. L4 hanya melihat alamat IP dan port."}, {"q": "Apa yang dilakukan load balancer ketika satu server gagal health check?", "o": ["Mengirim ulang semua request ke server itu", "Berhenti mengarahkan trafik ke server itu", "Mematikan semua server"], "a": 1, "e": "Server yang sakit dikeluarkan dari rotasi sampai sehat kembali."}, {"q": "Request punya durasi sangat bervariasi. Algoritma mana yang lebih cocok?", "o": ["Round robin", "Least connections", "Selalu ke server pertama"], "a": 1, "e": "Least connections menghindari server yang sedang menumpuk request lama."}, {"q": "Kenapa L4 umumnya lebih ringan daripada L7?", "o": ["L4 tidak perlu membongkar dan membaca isi HTTP", "L4 memakai server lebih sedikit", "L4 tidak mendukung TCP"], "a": 0, "e": "L7 harus mem-parse request (dan sering memutus TLS), jadi butuh komputasi lebih banyak."}]},
  {id:'n3',cat:'jaringan',t:'CDN dan edge caching',s:'CDN',lv:1,min:10,dg:'cdn',d:'Menaruh salinan konten di server yang dekat dengan user agar halaman terasa cepat di mana pun, sekaligus melindungi origin.',p:['Konten statis seperti gambar, CSS, dan video adalah kandidat utama CDN.','Cache key dan header Cache-Control menentukan apa yang boleh disimpan di edge.','Purge atau versi pada nama file dipakai saat konten berubah.'],qz:[{"q": "Kenapa CDN menurunkan latensi?", "o": ["Konten disajikan dari lokasi yang lebih dekat ke user", "Database menjadi lebih cepat", "Ukuran file otomatis mengecil"], "a": 0, "e": "Jarak fisik yang lebih pendek berarti waktu tempuh jaringan lebih singkat."}, {"q": "Konten mana yang paling cocok disimpan di CDN?", "o": ["Saldo rekening user", "Gambar produk dan file CSS", "Isi keranjang belanja pribadi"], "a": 1, "e": "Konten statis yang sama untuk semua orang paling mudah dan aman di-cache di edge."}, {"q": "Kamu mengubah app.css tapi user masih melihat versi lama dari CDN. Solusi yang umum adalah...", "o": ["Menunggu server origin restart", "Memberi versi pada nama file, misalnya app.3f9a.css", "Mematikan CDN selamanya"], "a": 1, "e": "Nama file baru berarti cache key baru, jadi edge langsung mengambil versi terbaru."}, {"q": "Selain kecepatan, apa manfaat CDN bagi server origin?", "o": ["Origin menerima jauh lebih sedikit request", "Origin tidak perlu database", "Origin bisa memakai HTTP saja"], "a": 0, "e": "Sebagian besar request dilayani edge, jadi beban dan bandwidth origin turun."}]},
  {id:'s1',cat:'storage',t:'SQL vs NoSQL',s:'SQL vs NoSQL',lv:0,min:10,dg:'web',d:'Membandingkan database relasional dan non-relasional dari sisi model data, transaksi, dan cara scaling.',p:['SQL unggul untuk relasi kompleks dan transaksi ACID.','NoSQL (key-value, dokumen, wide-column) unggul untuk skema fleksibel dan scaling horizontal.','Pilih berdasarkan pola akses data, bukan tren.'],qz:[{"q": "Aplikasi transfer uang butuh dua update saldo yang harus sukses bersamaan. Pilihan paling aman adalah...", "o": ["Database relasional dengan transaksi ACID", "Cache in-memory", "File log"], "a": 0, "e": "Transaksi ACID menjamin kedua update terjadi atau tidak sama sekali."}, {"q": "Kapan database dokumen (NoSQL) sering lebih cocok?", "o": ["Saat data punya banyak relasi dan join kompleks", "Saat bentuk data sering berubah dan dibaca utuh per dokumen", "Saat butuh laporan akuntansi"], "a": 1, "e": "Model dokumen fleksibel dan cocok ketika satu entitas dibaca bersama-sama."}, {"q": "Apa dasar terbaik memilih SQL atau NoSQL?", "o": ["Mana yang sedang populer", "Pola akses dan kebutuhan konsistensi data", "Mana yang paling baru"], "a": 1, "e": "Mulai dari pertanyaan apa yang dibaca dan ditulis, seberapa sering, dan seberapa konsisten."}, {"q": "Apa kegunaan indeks pada tabel SQL?", "o": ["Mengompres tabel agar lebih kecil", "Mempercepat pencarian baris tanpa membaca seluruh tabel", "Mencadangkan data ke server lain"], "a": 1, "e": "Indeks seperti daftar isi. Coba bedanya di lab SQL."}]},
  {id:'s2',cat:'storage',t:'Replikasi primary-replica',s:'Replikasi',lv:1,min:12,dg:'repl',d:'Menyalin data ke beberapa node agar baca bisa disebar dan sistem tetap hidup saat satu node mati.',p:['Tulis ke primary, baca dari replica untuk menyebar beban baca.','Replikasi asinkron cepat tapi bisa menimbulkan replication lag.','Failover mempromosikan replica menjadi primary baru saat primary mati.'],qz:[{"q": "Dalam replikasi primary-replica, ke mana operasi tulis dikirim?", "o": ["Ke replica mana saja", "Ke primary", "Ke semua node bergantian"], "a": 1, "e": "Primary adalah satu-satunya sumber tulis. Replica menyalin perubahannya."}, {"q": "Apa risiko membaca dari replica dengan replikasi asinkron?", "o": ["Data yang terbaca bisa belum terbaru", "Primary jadi read-only", "Replica menolak semua query"], "a": 0, "e": "Ada jeda (replication lag) sebelum perubahan di primary sampai ke replica."}, {"q": "User mengubah profil lalu langsung melihat versi lama. Penyebab yang paling mungkin adalah...", "o": ["Replication lag karena membaca dari replica", "Load balancer rusak", "Indeks database hilang"], "a": 0, "e": "Solusi umum: baca dari primary sebentar setelah user menulis (read-your-writes)."}, {"q": "Apa yang terjadi saat failover?", "o": ["Semua data dihapus", "Sebuah replica dipromosikan menjadi primary baru", "Sistem berhenti sampai primary lama diperbaiki"], "a": 1, "e": "Failover membuat sistem tetap bisa menerima tulis walau primary lama mati."}]},
  {id:'s3',cat:'storage',t:'Sharding dan partisi',s:'Sharding',lv:2,min:14,dg:'shard',d:'Memecah data ke beberapa mesin berdasarkan shard key saat satu database tidak lagi cukup.',p:['Shard key yang baik menyebar data dan trafik secara merata.','Query lintas shard dan join menjadi mahal setelah sharding.','Resharding sulit, jadi rencanakan jumlah partisi sejak awal.'],qz:[{"q": "Apa yang terjadi jika shard key dipilih dengan buruk?", "o": ["Muncul hot shard yang menerima trafik jauh lebih besar", "Data otomatis tereplikasi", "Query join jadi lebih cepat"], "a": 0, "e": "Distribusi yang timpang membuat satu shard kewalahan sementara yang lain menganggur."}, {"q": "Mana shard key yang lebih baik untuk tabel pesanan aplikasi e-commerce besar?", "o": ["Negara pembeli", "ID user", "Tanggal hari ini"], "a": 1, "e": "ID user tersebar merata. Tanggal hari ini membuat semua tulis masuk ke satu shard."}, {"q": "Operasi apa yang menjadi mahal setelah data di-shard?", "o": ["Membaca satu baris lewat shard key", "Join dan query yang melibatkan banyak shard", "Menulis satu baris baru"], "a": 1, "e": "Query lintas shard harus bertanya ke banyak mesin lalu menggabungkan hasilnya."}, {"q": "Kenapa jumlah partisi sebaiknya direncanakan sejak awal?", "o": ["Resharding memindahkan banyak data dan sulit dilakukan tanpa gangguan", "Database menolak partisi baru", "Partisi menambah biaya lisensi"], "a": 0, "e": "Memindahkan data antar shard saat sistem hidup adalah operasi berisiko."}]},
  {id:'s4',cat:'storage',t:'Consistent hashing',s:'Consistent hashing',lv:2,min:13,dg:'shard',d:'Teknik memetakan kunci ke node sehingga menambah atau mengurangi node hanya memindahkan sebagian kecil data.',p:['Node dan kunci ditaruh di cincin hash yang sama.','Saat node ditambah, hanya kunci di antara node baru dan tetangganya yang pindah.','Virtual node membuat distribusi beban lebih merata.'],qz:[{"q": "Dengan hash biasa (hash mod N), apa yang terjadi saat satu server ditambah?", "o": ["Hampir semua kunci pindah ke server lain", "Tidak ada kunci yang pindah", "Hanya kunci baru yang terpengaruh"], "a": 0, "e": "Nilai N berubah, jadi hasil modulo hampir semua kunci ikut berubah."}, {"q": "Dengan consistent hashing, kunci mana yang pindah saat node baru ditambahkan?", "o": ["Semua kunci", "Hanya kunci di antara node baru dan tetangga sebelumnya di cincin", "Kunci yang paling sering diakses"], "a": 1, "e": "Node lain tidak terpengaruh, jadi data yang pindah hanya sebagian kecil."}, {"q": "Apa fungsi virtual node?", "o": ["Mengenkripsi kunci", "Meratakan distribusi beban antar node fisik", "Menggantikan replikasi"], "a": 1, "e": "Setiap node fisik muncul di banyak titik cincin sehingga pembagiannya lebih merata."}, {"q": "Di mana consistent hashing banyak dipakai?", "o": ["Cluster cache terdistribusi dan database seperti Cassandra", "Load balancer L4 satu server", "Algoritma sorting"], "a": 0, "e": "Sistem yang sering menambah atau mengurangi node mendapat manfaat terbesar."}]},
  {id:'c1',cat:'cache',t:'Pola cache-aside',s:'Cache-aside',lv:0,min:9,dg:'cache',d:'Aplikasi memeriksa cache lebih dulu, membaca database saat miss, lalu mengisi cache untuk request berikutnya.',p:['Pola caching paling umum karena sederhana dan aman saat cache mati.','Cache miss pertama tetap lambat; hit berikutnya cepat.','TTL membatasi seberapa lama data basi boleh disajikan.'],qz:[{"q": "Pada pola cache-aside, siapa yang mengisi cache setelah cache miss?", "o": ["Database secara otomatis", "Aplikasi", "Client"], "a": 1, "e": "Aplikasi membaca database, lalu menulis hasilnya ke cache untuk request berikutnya."}, {"q": "Apa yang terjadi pada request pertama untuk data yang belum ada di cache?", "o": ["Request gagal", "Request tetap lambat karena harus ke database", "Cache membuat data palsu"], "a": 1, "e": "Cache miss pertama selalu membayar biaya penuh. Hit berikutnya yang cepat."}, {"q": "Kenapa cache-aside dianggap aman saat cache mati?", "o": ["Aplikasi tetap bisa membaca langsung dari database", "Cache punya cadangan otomatis", "Database ikut mati sehingga konsisten"], "a": 0, "e": "Cache hanya optimasi. Sistem tetap jalan walau lebih lambat."}, {"q": "Apa peran TTL di cache-aside?", "o": ["Membatasi berapa lama data basi boleh disajikan", "Menentukan ukuran maksimal cache", "Mengenkripsi isi cache"], "a": 0, "e": "Setelah TTL habis, data diambil ulang dari database. Coba SET dengan EX di lab Redis."}]},
  {id:'c2',cat:'cache',t:'Write-through vs write-back',s:'Write policy',lv:1,min:11,dg:'cache',d:'Dua cara menangani operasi tulis saat ada cache: tulis ke keduanya sekaligus, atau tulis ke cache dulu dan database belakangan.',p:['Write-through menjaga cache dan database selalu sinkron, dengan biaya latensi tulis.','Write-back cepat untuk tulis, tapi data bisa hilang jika cache mati sebelum flush.','Write-around melewati cache untuk data yang jarang dibaca ulang.'],qz:[{"q": "Write-through berarti...", "o": ["Tulis ke cache dan database sekaligus", "Tulis ke cache dulu, database belakangan", "Tulis hanya ke database"], "a": 0, "e": "Keduanya selalu sinkron, dengan biaya latensi tulis yang lebih tinggi."}, {"q": "Apa risiko utama write-back?", "o": ["Tulis menjadi sangat lambat", "Data hilang jika cache mati sebelum sempat di-flush ke database", "Cache tidak pernah terisi"], "a": 1, "e": "Data hanya ada di cache untuk sementara, jadi kegagalan cache bisa menghilangkannya."}, {"q": "Data log yang ditulis sekali dan jarang dibaca ulang paling cocok memakai...", "o": ["Write-through", "Write-back", "Write-around"], "a": 2, "e": "Write-around tidak mengotori cache dengan data yang tidak akan dibaca lagi."}, {"q": "Aplikasi butuh tulis secepat mungkin dan bisa menerima risiko kehilangan sedikit data. Pilihan yang cocok adalah...", "o": ["Write-back", "Write-through", "Tanpa cache"], "a": 0, "e": "Write-back mengembalikan respons begitu data masuk cache."}]},
  {id:'c3',cat:'cache',t:'Invalidasi dan eviction',s:'Eviction',lv:1,min:10,dg:'cache',d:'Memori cache terbatas. Pelajari kapan data dibuang (LRU, LFU, TTL) dan cara mencegah data basi.',p:['LRU membuang data yang paling lama tidak diakses.','Invalidasi eksplisit saat data berubah lebih akurat daripada menunggu TTL.','Waspadai thundering herd saat banyak kunci kedaluwarsa bersamaan.'],qz:[{"q": "Kebijakan LRU membuang data yang...", "o": ["Paling jarang diakses sepanjang waktu", "Paling lama tidak diakses", "Paling besar ukurannya"], "a": 1, "e": "Least Recently Used: yang terakhir dipakai paling lama dibuang lebih dulu."}, {"q": "Harga produk berubah. Cara paling akurat agar cache tidak menyajikan harga lama adalah...", "o": ["Menunggu TTL habis", "Menghapus atau memperbarui kunci cache saat harga diubah", "Me-restart server cache"], "a": 1, "e": "Invalidasi eksplisit langsung membuang data basi tanpa menunggu."}, {"q": "Apa itu thundering herd?", "o": ["Banyak request menghantam database bersamaan saat kunci populer kedaluwarsa", "Cache yang terlalu penuh", "Serangan DDoS ke CDN"], "a": 0, "e": "Semua request mengalami miss di saat yang sama lalu menyerbu database."}, {"q": "Cara sederhana mencegah banyak kunci kedaluwarsa bersamaan adalah...", "o": ["Memberi TTL dengan sedikit variasi acak", "Memakai TTL yang sama persis untuk semua kunci", "Menonaktifkan TTL"], "a": 0, "e": "Jitter pada TTL menyebar waktu kedaluwarsa sehingga beban ke database lebih rata."}]},
  {id:'m1',cat:'msg',t:'Message queue',s:'Queue',lv:0,min:9,dg:'queue',d:'Memisahkan pengirim dan pemroses dengan antrean pesan agar sistem tahan lonjakan dan kegagalan sementara.',p:['Producer tidak perlu menunggu pekerjaan selesai.','Worker bisa ditambah sesuai panjang antrean.','Ack dan retry memastikan pesan tidak hilang saat worker gagal.'],qz:[{"q": "Kenapa queue membantu saat terjadi lonjakan trafik?", "o": ["Pesan ditampung lalu diproses bertahap", "Queue menambah server secara otomatis", "Pesan lama dihapus"], "a": 0, "e": "Queue menyerap lonjakan sehingga worker bekerja dengan kecepatan stabil."}, {"q": "Antrean terus memanjang. Langkah paling langsung adalah...", "o": ["Menambah worker", "Menghapus queue", "Mengurangi producer menjadi satu"], "a": 0, "e": "Worker tambahan menaikkan kecepatan pemrosesan pesan."}, {"q": "Apa fungsi ack (acknowledgement) dari worker?", "o": ["Memberi tahu broker pesan sudah selesai diproses sehingga boleh dihapus", "Mengenkripsi pesan", "Mengirim pesan ke semua worker"], "a": 0, "e": "Tanpa ack, broker mengirim ulang pesan jika worker gagal di tengah jalan."}, {"q": "Pekerjaan mana yang paling cocok dipindah ke queue?", "o": ["Mengirim email konfirmasi setelah pendaftaran", "Menampilkan halaman login", "Validasi password saat login"], "a": 0, "e": "User tidak perlu menunggu email terkirim. Pekerjaan itu bisa selesai belakangan."}]},
  {id:'m2',cat:'msg',t:'Pub/Sub',s:'Pub/Sub',lv:1,min:10,dg:'pubsub',d:'Satu event dikirim ke banyak layanan yang tertarik, tanpa pengirim perlu tahu siapa saja penerimanya.',p:['Topic menjadi kontrak antara publisher dan subscriber.','Setiap subscriber memproses dengan kecepatan dan offset sendiri.','Cocok untuk notifikasi, analitik, dan sinkronisasi antar layanan.'],qz:[{"q": "Apa beda utama pub/sub dengan queue biasa?", "o": ["Satu event bisa diterima banyak subscriber", "Pub/sub tidak menyimpan pesan sama sekali", "Pub/sub hanya untuk satu consumer"], "a": 0, "e": "Di queue, satu pesan diambil satu worker. Di pub/sub, setiap subscriber mendapat salinannya."}, {"q": "Apa keuntungan publisher tidak perlu tahu siapa subscriber-nya?", "o": ["Layanan baru bisa ikut berlangganan tanpa mengubah publisher", "Pesan menjadi lebih kecil", "Tidak perlu jaringan"], "a": 0, "e": "Topic menjadi kontrak. Penerima bisa ditambah atau dikurangi dengan bebas."}, {"q": "Layanan analitik lambat memproses event. Apa dampaknya pada subscriber lain?", "o": ["Semua subscriber ikut melambat", "Tidak ada, karena setiap subscriber punya posisi baca sendiri", "Publisher berhenti mengirim"], "a": 1, "e": "Setiap subscriber membaca dengan kecepatan dan offset masing-masing."}, {"q": "Contoh penggunaan pub/sub yang tepat adalah...", "o": ["Event \"pesanan dibuat\" dikirim ke layanan email, stok, dan analitik", "Menyimpan saldo rekening", "Membaca file konfigurasi"], "a": 0, "e": "Satu kejadian yang perlu diketahui banyak layanan adalah kasus klasik pub/sub."}]},
  {id:'m3',cat:'msg',t:'Jaminan pengiriman pesan',s:'Delivery',lv:2,min:13,dg:'queue',d:'At-most-once, at-least-once, dan exactly-once: apa artinya dan kenapa idempotensi lebih penting dari janji broker.',p:['At-least-once paling umum, sehingga pesan bisa diproses dua kali.','Buat consumer idempoten, misalnya dengan menyimpan ID pesan yang sudah diproses.','Exactly-once end-to-end butuh kerja sama broker dan aplikasi.'],qz:[{"q": "Dengan jaminan at-least-once, apa yang harus diwaspadai consumer?", "o": ["Pesan bisa hilang", "Pesan yang sama bisa diproses lebih dari sekali", "Pesan selalu datang berurutan"], "a": 1, "e": "Jika ack hilang, broker mengirim ulang pesan yang sebenarnya sudah diproses."}, {"q": "Apa arti consumer yang idempoten?", "o": ["Memproses pesan yang sama dua kali memberi hasil yang sama dengan sekali", "Consumer tidak pernah gagal", "Consumer memproses pesan secara paralel"], "a": 0, "e": "Contoh: menyimpan ID pesan yang sudah diproses lalu melewati duplikatnya."}, {"q": "At-most-once cocok untuk data seperti...", "o": ["Pembayaran", "Metrik suhu yang dikirim setiap detik", "Pesanan pelanggan"], "a": 1, "e": "Kehilangan satu titik metrik tidak masalah, dan tidak ada risiko duplikat."}, {"q": "Kenapa exactly-once end-to-end sulit dicapai?", "o": ["Broker dan aplikasi harus bekerja sama, termasuk efek samping di luar broker", "Karena jaringan terlalu cepat", "Karena pesan terlalu kecil"], "a": 0, "e": "Broker bisa menjamin pengiriman, tapi efek seperti menulis ke database tetap tanggung jawab aplikasi."}]},

// Kuis pelajaran (3–5 soal); pelajaran tanpa kuis sendiri memakai satu soal dari animasinya.
const quizOf = l => l.qz?.length ? l.qz : [DG[l.dg].quiz];
// Pengulangan berjarak (kotak Leitner): benar naik kotak dengan jeda 3, 7, 16, 35 hari; salah kembali ke kotak 0 (besok).
const SRS_DAYS = [1, 3, 7, 16, 35], DAY = 864e5;
const nextSrs = (cur, ok, now) => { const b = ok ? Math.min((cur?.b ?? 0) + 1, SRS_DAYS.length - 1) : 0; return {b, due: now + SRS_DAYS[b] * DAY, t: now}; };
// Jawaban benar sebelum jatuh tempo tidak menaikkan kotak, agar mengulang cepat-cepat tidak memperpanjang jeda.
function recordSrs(key, ok, now = Date.now()) {
  const cur = store.s.srs[key];
  if (!ok || !cur || cur.due <= now) store.s.srs[key] = nextSrs(cur, ok, now);
}
const srsItems = () => Object.entries(store.s.srs).flatMap(([key, v]) => {
  const [id, i] = key.split(':'), l = L.find(x => x.id === id), q = l && quizOf(l)[+i];
  return q ? [{key, l, q, due: v.due}] : []; // soal yang sudah dihapus admin dilewati
});
const dueQuestions = (now = Date.now()) => srsItems().filter(x => x.due <= now).sort((a, b) => a.due - b.due);
(function srsSelfTest() {
  const a = nextSrs(undefined, true, 0), b = nextSrs(a, false, 0), c = nextSrs({b: 4}, true, 0);
  console.assert(a.b === 1 && a.due === 3 * DAY && b.b === 0 && b.due === DAY && c.b === 4 && c.due === 35 * DAY, 'srs: jadwal kotak Leitner');
})();
const quizFields = items => items.map(({q, sub}, i) => `<fieldset data-q="${i}"><legend><span class="num">${i + 1}.</span> ${esc(q.q)}</legend>${sub || ''}${shuffle(q.o.map((_, j) => j)).map(j => `<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>${esc(q.o[j])}</span></label>`).join('')}<p class="qexp" aria-live="polite"></p></fieldset>`).join('');
// Menilai form kuis: menandai tiap soal dan menampilkan penjelasannya. Mengembalikan null jika masih ada soal kosong.
function gradeQuiz(form, qs) {
  const f = new FormData(form), ans = qs.map((_, i) => f.get('q' + i)), r = $('.qres', form);
  const left = ans.filter(v => v === null).length;
  if (left) { r.className = 'qres'; r.textContent = `Masih ada ${left} soal yang belum dijawab.`; return null; }
  return qs.map((q, i) => {
    const ok = +ans[i] === q.a, fs = $(`[data-q="${i}"]`, form);
    fs.className = ok ? 'ok' : 'no';
    $('.qexp', fs).textContent = (ok ? 'Benar. ' : 'Belum tepat. ') + (q.e || (ok ? '' : 'Tonton ulang langkah animasinya.'));
    return ok;
  });
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Shared renderers ---------- */
const nodeW = label => Math.max(72, Math.round(label.length * 5.4 + 18));
function shapeSVG(type, x, y, w = 72, h = 28) {
  const hw = w / 2, hh = h / 2;
  if (type === 'db') return `<path class="shape" d="M${x - hw},${y - hh + 4}v${h - 8}a${hw},4 0 0 0 ${w},0v${-(h - 8)}a${hw},4 0 0 0 ${-w},0a${hw},4 0 0 0 ${w},0"/>`;
  if (type === 'lb') return `<path class="shape" d="M${x - hw + 8},${y - hh}H${x + hw - 8}L${x + hw},${y}L${x + hw - 8},${y + hh}H${x - hw + 8}L${x - hw},${y}Z"/>`;
  if (type === 'cdn') return `<ellipse class="shape" cx="${x}" cy="${y}" rx="${hw}" ry="${hh}"/>`;
  const rx = type === 'client' || type === 'reject' ? hh : 5;
  let s = `<rect class="shape" x="${x - hw}" y="${y - hh}" width="${w}" height="${h}" rx="${rx}"/>`;
  if (type === 'queue') s += `<path class="slots" d="M${x + hw - 18},${y - 8}v16M${x + hw - 13},${y - 8}v16M${x + hw - 8},${y - 8}v16"/>`;
  return s;
}
const parseFlow = f => { const bad = f[0] === '!', [a, b] = f.replace('!', '').split('>'); return {a, b, bad}; };
function diagramSVG(id, thumb) {
  const D = typeof id === 'string' ? DG[id] : id, P = Object.fromEntries(D.nodes.map(n => [n[0], n]));
  const edges = D.edges.map(e => { const [a, b] = e.split('-'); return `<line class="edge" data-e="${e}" x1="${P[a][2]}" y1="${P[a][3]}" x2="${P[b][2]}" y2="${P[b][3]}"/>`; }).join('');
  let pk = '';
  if (thumb) {
    const s = D.steps.reduce((m, s) => s.f.length > m.f.length ? s : m);
    pk = s.f.map((f, i) => {
      const {a, b, bad} = parseFlow(f), A = P[a], B = P[b], k = bad ? .55 : 1;
      const x2 = A[2] + (B[2] - A[2]) * k, y2 = A[3] + (B[3] - A[3]) * k;
      return [0, 1].map(j => `<circle r="3.6" class="pk${bad ? ' bad' : ''}" style="--x1:${A[2]}px;--y1:${A[3]}px;--x2:${x2}px;--y2:${y2}px;animation-delay:${-(j * .8 + i * .27).toFixed(2)}s"/>`).join('');
    }).join('');
  }
  const nodes = D.nodes.map(([nid, type, x, y, label]) => `<g class="node" data-n="${nid}" style="--tc:var(${TYPES[type].v})">${shapeSVG(type, x, y, nodeW(label))}<text x="${x}" y="${y + (type === 'db' ? 5 : 3.5)}">${esc(label)}</text></g>`).join('');
  return `<svg viewBox="0 0 320 180" class="${thumb ? 'dg' : 'dg stage'}" ${thumb ? 'aria-hidden="true"' : 'role="img" aria-label="Diagram animasi"'}><g>${edges}</g><g class="pk-layer">${pk}</g>${nodes}</svg>`;
}
function lvShape(lv, x, y, s, fill, stroke, sw) {
  const a = `fill="${fill}" stroke="${stroke}" stroke-width="${sw}"`;
  if (lv === 0) return `<circle cx="${x}" cy="${y}" r="${s}" ${a}/>`;
  if (lv === 1) return `<circle cx="${x}" cy="${y}" r="${s}" ${a}/><circle cx="${x}" cy="${y}" r="${(s * .4).toFixed(1)}" fill="${stroke}"/>`;
  const k = s * .82;
  return `<rect x="${x - k}" y="${y - k}" width="${2 * k}" height="${2 * k}" rx="1.5" transform="rotate(45 ${x} ${y})" ${a}/>`;
}
const lvIcon = lv => `<svg class="lv" viewBox="0 0 16 16" aria-hidden="true">${lvShape(lv, 8, 8, 5, 'none', 'currentColor', 1.7)}</svg>`;
const prog = id => store.s.progress[id] || 0;

function cardHTML(l) {

}

function mapSVG() {
  const gap = 40, top = 38, n = CATS.length, mid = top + gap * (n - 1) / 2, ox = 70, bend = 128, sx = 250, step = 160;
  let lines = '', trains = '', st = '';

// Jarak edit (Damerau, varian OSA: tukar dua huruf bersebelahan dihitung 1) dengan batas: berhenti begitu melewati max.
function editDist(a, b, max) {
  let pp = [], prev = Array.from({length: b.length + 1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) cur[j] = Math.min(cur[j], pp[j - 2] + 1);
    }
    if (Math.min(...cur) > max) return max + 1;
    pp = prev; prev = cur;
  }
  return prev[b.length];
}
const words = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/[^a-z0-9]+/).filter(Boolean);
// Setiap kata di kueri harus cocok dengan awal salah satu kata, boleh salah ketik 1 huruf (2 untuk kata 7+ huruf).
function fuzzy(q, text) {
  const hay = words(text);
  return words(q).every(t => {
    const tol = t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0;
    return hay.some(w => w.includes(t) || (tol && editDist(t, w.slice(0, t.length), tol) <= tol) || (tol && editDist(t, w, tol) <= tol));
  });
}

const STEP = 6000;
function mountPlayer(el, D, onStep) {
  const steps = D.steps, total = steps.length * STEP, P = Object.fromEntries(D.nodes.map(n => [n[0], n]));
  const layer = $('.pk-layer', el), segs = $$('.seg i', el), playBtn = $('[data-act=play]', el), timeEl = $('.time', el), spdBtn = $('.spd', el);
  const pool = Array.from({length: 40}, () => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', '3.6'); c.setAttribute('class', 'pp'); c.style.display = 'none'; layer.append(c);
    return {el: c, live: false, k: 0, f: null};
  });
  let t = 0, playing = false, speed = 1, cur = -1, raf = 0, last = 0, flows = [], lastSec = -1, autoPaused = false;

  function clearPackets() { pool.forEach(p => { p.live = false; p.el.style.display = 'none'; }); }
  function apply(i) {
    cur = i; const s = steps[i];
    flows = s.f.map(f => { const {a, b, bad} = parseFlow(f); return {A: P[a], B: P[b], bad, acc: 650 - Math.random() * 300}; });
    const on = new Set(s.f.map(f => { const {a, b} = parseFlow(f); return D.edges.includes(`${a}-${b}`) ? `${a}-${b}` : `${b}-${a}`; }));
    $$('.node', el).forEach(n => { n.classList.toggle('hl', (s.h || []).includes(n.dataset.n)); n.classList.toggle('down', (s.x || []).includes(n.dataset.n)); });
    $$('.edge', el).forEach(e => { e.classList.toggle('on', on.has(e.dataset.e)); e.classList.toggle('cut', (s.cut || []).includes(e.dataset.e)); });
    $('.cap b', el).textContent = `${i + 1}. ${s.t}`;
    $('.cap span', el).textContent = s.d;
    onStep(i, steps.length, speed);
  }
  function spawn(f) {
    const p = pool.find(p => !p.live); if (!p) return;
    p.live = true; p.k = 0; p.f = f; p.el.style.display = ''; p.el.style.opacity = 1;
    p.el.classList.toggle('bad', f.bad);
  }
  function draw(dt) {
    for (const f of flows) { f.acc += dt; if (f.acc >= 650) { f.acc = 0; spawn(f); } }
    for (const p of pool) {
      if (!p.live) continue;
      p.k += dt / 1100;
      const lim = p.f.bad ? .55 : 1;
      if (p.k >= lim) { p.live = false; p.el.style.display = 'none'; continue; }
      const {A, B} = p.f;
      p.el.setAttribute('transform', `translate(${A[2] + (B[2] - A[2]) * p.k} ${A[3] + (B[3] - A[3]) * p.k})`);
      if (p.f.bad) p.el.style.opacity = Math.max(0, 1 - Math.max(0, p.k - .3) / .25);
    }
  }
  function ui() {
    segs.forEach((s, j) => { s.style.transform = `scaleX(${Math.min(1, Math.max(0, (t - j * STEP) / STEP))})`; });
    const sec = Math.floor(t / 1000);
    if (sec !== lastSec) { lastSec = sec; timeEl.textContent = `${mmss(t)} / ${mmss(total)}`; }
  }

  function pause() { playing = false; cancelAnimationFrame(raf); setBtn(); }
  function seek(i) { i = Math.max(0, Math.min(steps.length - 1, i)); t = i * STEP; clearPackets(); apply(i); ui(); }

  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.seek) seek(+b.dataset.seek);
    else if (b.dataset.act === 'play') playing ? pause() : play();
    else if (b.dataset.act === 'prev') seek(cur - 1);
    else if (b.dataset.act === 'next') seek(cur + 1);

  });

    if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;

    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(cur - 1); }
  });

  const io = new IntersectionObserver(([e]) => {
    if (!e.isIntersecting && playing) { autoPaused = true; pause(); }
    else if (e.isIntersecting && autoPaused) { autoPaused = false; play(); }

}

// shortcut: model aliran steady-state (bukan simulasi event diskret); cukup untuk intuisi, ganti dengan sim per-request untuk materi p99.
function simulate(g, rps) {
  const st = {}, kids = {}, indeg = {}, by = {};
  g.nodes.forEach(n => { st[n.id] = {in: 0, drop: 0, backlog: 0, rho: 0}; kids[n.id] = []; indeg[n.id] = 0; by[n.id] = n; });
  g.edges.forEach(([a, b]) => { kids[a].push(b); indeg[b]++; });
  const order = [], q = g.nodes.filter(n => !indeg[n.id]).map(n => n.id);
  while (q.length) { const id = q.shift(); order.push(id); kids[id].forEach(k => { if (!--indeg[k]) q.push(k); }); }
  const clients = g.nodes.filter(n => n.type === 'client');
  clients.forEach(n => { st[n.id].in = rps / clients.length; });
  const edgeFlow = {};
  for (const id of order) {
    const n = by[id], s = st[id], ks = kids[id];
    const served = Math.min(s.in, n.cap);
    s.drop = s.in - served; s.rho = isFinite(n.cap) ? s.in / n.cap : 0;
    const fwd = served * (1 - (n.hit || 0));
    if (!ks.length) { if (!TERMINAL.has(n.type)) s.drop += fwd; continue; }
    if (n.type === 'queue') {
      // Queue hanya meneruskan sebanyak yang sanggup diproses worker; sisanya menumpuk, bukan ditolak.
      const kcap = ks.reduce((a, k) => a + by[k].cap, 0), send = Math.min(fwd, kcap);
      s.backlog = fwd - send;
      ks.forEach(k => { const f = send * (isFinite(kcap) ? by[k].cap / kcap : 1 / ks.length); st[k].in += f; edgeFlow[id + '>' + k] = f; });
    } else ks.forEach(k => { const f = fwd / ks.length; st[k].in += f; edgeFlow[id + '>' + k] = f; });
  }
  const Lt = {};
  for (const id of [...order].reverse()) {
    const n = by[id], ks = kids[id];
    const own = PG[n.type].ms / (1 - Math.min(st[id].rho, .95));
    const down = n.type === 'queue' || !ks.length ? 0 : ks.reduce((a, k) => a + Lt[k], 0) / ks.length;
    Lt[id] = own + (1 - (n.hit || 0)) * down;
  }
  const drop = g.nodes.reduce((a, n) => a + st[n.id].drop, 0);
  return {
    st, edgeFlow, drop, ok: rps - drop, err: rps ? drop / rps : 0,
    lat: clients.length ? clients.reduce((a, n) => a + Lt[n.id], 0) / clients.length : 0,
    cost: g.nodes.reduce((a, n) => a + (isFinite(n.cap) ? PG[n.type].cost * n.cap / PG[n.type].cap : 0), 0),
    backlog: g.nodes.reduce((a, n) => a + st[n.id].backlog, 0),

}

function encodeDesign(g, rps) {
  const ix = new Map(g.nodes.map((n, i) => [n.id, i]));
  const json = JSON.stringify({r: rps, n: g.nodes.map(n => [n.type, Math.round(n.x), Math.round(n.y), n.cap, n.hit ?? null]), e: g.edges.map(([a, b]) => [ix.get(a), ix.get(b)])});

function decodeDesign(code) {
  try {
    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(code.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))));
    if (!Array.isArray(d.n) || !Array.isArray(d.e) || !d.n.length || d.n.length > 40 || d.e.length > 200) return null;
    const g = {nodes: [], edges: []};
    for (const v of d.n) {
      if (!Array.isArray(v)) return null;
      const [type, x, y, cap, hit] = v;
      if (!Object.hasOwn(PG, type) || !Number.isFinite(x) || !Number.isFinite(y)) return null;
      const n = mkNode(type, clamp(x, NW / 2, W - NW / 2), clamp(y, NH / 2, H - NH / 2), g);
      if (isFinite(n.cap) && Number.isFinite(cap)) n.cap = clamp(cap, PG[type].cap * .5, PG[type].cap * 4);
      if (n.hit != null && Number.isFinite(hit)) n.hit = clamp(hit, 0, .99);
      g.nodes.push(n);
    }
    const links = d.e.filter(e => Array.isArray(e) && g.nodes[e[0]] && g.nodes[e[1]]).map(([a, b]) => [g.nodes[a].id, g.nodes[b].id]);
    return {g, links, rps: clamp(Math.round(+d.r / 100) * 100 || 3000, 100, 30000)};
  } catch { return null; }
}

function tokenize(s) { // aturan kutip seperti redis-cli

  console.assert(x('SET a 1 EX 10') === 'OK' && x('INCR a') === '(integer) 2' && x('TTL a') === '(integer) 10' && x('TTL nope') === '(integer) -2', 'redis: SET EX, INCR menjaga TTL');
  t = 10000;
  console.assert(x('GET a') === '(nil)' && x('EXISTS a') === '(integer) 0', 'redis: kunci hilang setelah TTL');
  console.assert(x('SET s "halo dunia"') === 'OK' && x('GET s') === '"halo dunia"' && x('INCR s').startsWith('(error) ERR value') && x('SET s x NX') === '(nil)', 'redis: string, kutip, NX');
  console.assert(x('RPUSH q a b') === '(integer) 2' && x('LPUSH q z') === '(integer) 3' && x('LRANGE q 0 -1') === '1) "z"\n2) "a"\n3) "b"' && x('GET q').startsWith('(error) WRONGTYPE') && x('LPOP q') === '"z"', 'redis: list');
  console.assert(x('get').startsWith('(error) ERR wrong number') && x('constructor').startsWith('(error) ERR unknown') && x('KEYS *') === '1) "q"\n2) "s"' && x('SET k "x').startsWith('(error)'), 'redis: error dan KEYS');
})();

function viewLabRedis(box) {
  const r = makeRedis(), hist = [], incrKeys = new Set(), done = new Set();
  let hi = 0;
  const EX = ['SET sesi:42 aktif EX 15', 'TTL sesi:42', 'INCR kunjungan', 'EXPIRE kunjungan 60', 'RPUSH tugas email-1 email-2', 'LPOP tugas', 'KEYS *'];
  const TASKS = [
    'Simpan sesi yang hilang sendiri, misalnya SET sesi:42 aktif EX 15',
    'Hitung kunjungan dengan INCR sampai angkanya 3',
    'Buat rate limiter: INCR sebuah kunci, lalu EXPIRE kunci yang sama',
    'Tunggu sampai sebuah kunci hilang karena TTL-nya habis',
    'Pakai list sebagai antrean: RPUSH beberapa tugas, lalu LPOP',
  ];
  box.innerHTML = `<div class="lab-body">
    <section class="panel term" aria-labelledby="h-cli"><h2 id="h-cli">Konsol</h2>
      <div class="cli-out" id="cli-out" role="log" aria-live="polite"></div>
      <form class="cli-in" id="cli-form"><label for="cli">redis&gt;</label><input id="cli" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ketik perintah lalu tekan Enter"></form>
      <div class="cli-ex"><span class="muted">Coba</span>${EX.map(c => `<button class="chip mono" data-cmd="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <p class="muted small">Perintah yang didukung: ${r.names.join(', ')}. Panah atas dan bawah memanggil perintah sebelumnya.</p>
    </section>
    <div class="side">
      <section class="panel" aria-labelledby="h-mem"><h2 id="h-mem">Isi memori <span class="muted num" id="mem-n"></span></h2><ul class="mem" id="mem"></ul></section>
      <section class="panel" aria-labelledby="h-lt"><h2 id="h-lt">Latihan</h2><ul class="checks" id="lab-checks"></ul></section>
    </div></div>`;
  const out = $('#cli-out', box), input = $('#cli', box);
  const log = (cls, text) => {
    out.insertAdjacentHTML('beforeend', `<div class="${cls}">${esc(text)}</div>`);
    while (out.children.length > 300) out.firstChild.remove();
    out.scrollTop = out.scrollHeight;
  };
  function renderMem() {
    const now = Date.now(), keys = [...r.db.entries()].sort(([a], [b]) => a.localeCompare(b));
    $('#mem-n', box).textContent = keys.length ? `${keys.length} kunci` : '';
    $('#mem', box).innerHTML = keys.length ? keys.map(([k, e]) => {
      const left = e.exp == null ? null : Math.max(0, e.exp - now), v = e.type === 'list' ? `[${e.v.map(x => JSON.stringify(x)).join(', ')}]` : JSON.stringify(e.v);
      return `<li><div class="mem-k"><b class="mono">${esc(k)}</b><span class="tag">${e.type}</span></div><div class="mem-v mono" title="${esc(v)}">${esc(v)}</div>`
        + (left == null ? '<div class="ttl muted">Tanpa TTL, disimpan sampai dihapus</div>' : `<div class="ttl"><i style="--p:${(left / e.ttl0).toFixed(3)}"></i><span class="num">${(left / 1000).toFixed(1)} dtk</span></div>`) + '</li>';
    }).join('') : '<li class="muted">Memori kosong. Kunci yang kamu buat akan muncul di sini.</li>';
  }
  const renderChecks = () => { $('#lab-checks', box).innerHTML = TASKS.map((t, i) => `<li class="${done.has(i) ? 'pass' : 'todo'}">${ico(done.has(i) ? I.check : I.dot)}<span>${t}</span></li>`).join(''); };
  function run(line) {
    if (!line.trim()) return;
    if (hist.at(-1) !== line) hist.push(line);
    hi = hist.length;
    log('cmd', 'redis> ' + line);
    const res = r.exec(line), a = tokenize(line), cmd = a.err ? '' : (a[0] || '').toUpperCase();
    if (res) log(res.err ? 'err' : 'res', fmtReply(res));
    if (res && !res.err) {
      if ((cmd === 'SET' && res.status && /\s(EX|PX)\s/i.test(line)) || (cmd === 'EXPIRE' && res.int === 1)) done.add(0);
      if (/^INCR/.test(cmd)) { incrKeys.add(a[1]); if (res.int >= 3) done.add(1); }
      if ((cmd === 'LPOP' || cmd === 'RPOP') && res.bulk != null) done.add(4);
    }
    if ([...incrKeys].some(k => r.db.get(k)?.exp != null)) done.add(2);
    renderMem(); renderChecks();
  }
  box.onsubmit = e => { e.preventDefault(); run(input.value); input.value = ''; };
  box.onclick = e => { const c = e.target.closest('[data-cmd]'); if (c) { run(c.dataset.cmd); input.focus(); } };
  input.onkeydown = e => {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    hi = clamp(hi + (e.key === 'ArrowUp' ? -1 : 1), 0, hist.length);
    input.value = hist[hi] ?? '';
  };
  const tick = setInterval(() => {
    const gone = r.sweep();
    gone.forEach(k => log('sys', `Kunci "${k}" kedaluwarsa dan dihapus dari memori.`));
    if (gone.length) { done.add(3); renderChecks(); }
    if (gone.length || [...r.db.values()].some(e => e.exp != null)) renderMem();
  }, 200);
  log('sys', 'Terhubung ke emulator Redis di browser. Data hilang saat halaman ditutup.');
  renderMem(); renderChecks();
  return () => clearInterval(tick);
}

/* ---------- Lab: SQL ---------- */
const SQL_CDN = 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/';
let sqlJs = null;
// sql.js (~700 KB termasuk WASM) hanya dimuat saat lab SQL dibuka.
function loadSqlJs() {
  return sqlJs ||= new Promise((ok, bad) => {
    const s = document.createElement('script');
    s.src = SQL_CDN + 'sql-wasm.js'; s.crossOrigin = 'anonymous';
    s.integrity = 'sha384-8D3Rsfo535FqoC1pHCCQMrNf75UgzyoG/HQm9zOzITRrz3QKzecc2E7JXKGCXoWu';
    s.onload = ok; s.onerror = () => bad(new Error('sql.js tidak bisa dimuat. Periksa koneksi internet.'));
    document.head.append(s);
  }).then(() => initSqlJs({locateFile: f => SQL_CDN + f})).catch(e => { sqlJs = null; throw e; });
}
const SQL_SEED = `CREATE TABLE users(id INTEGER PRIMARY KEY, email TEXT NOT NULL, city TEXT NOT NULL, created_at TEXT NOT NULL);
CREATE TABLE orders(id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL, total INTEGER NOT NULL, status TEXT NOT NULL);
WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 100000)
INSERT INTO users SELECT i, 'user' || i || '@contoh.com', CASE i % 6 WHEN 0 THEN 'Jakarta' WHEN 1 THEN 'Bandung' WHEN 2 THEN 'Surabaya' WHEN 3 THEN 'Medan' WHEN 4 THEN 'Makassar' ELSE 'Yogyakarta' END, date('2024-01-01', '+' || (i % 700) || ' days') FROM n;
WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 300000)
INSERT INTO orders SELECT i, (i * 7919) % 100000 + 1, 5000 + (i * 37) % 2000 * 1000, CASE i % 4 WHEN 0 THEN 'dibatalkan' ELSE 'selesai' END FROM n;`;
const SQL_EX = [
  ['Cari user lewat email', "SELECT * FROM users WHERE email = 'user77777@contoh.com';"],
  ['Buat indeks email', 'CREATE INDEX idx_users_email ON users(email);'],
  ['Total belanja per user', "SELECT u.email, COUNT(*) AS pesanan, SUM(o.total) AS total\nFROM users u JOIN orders o ON o.user_id = u.id\nWHERE u.id <= 50\nGROUP BY u.id\nORDER BY total DESC\nLIMIT 10;"],
  ['Buat indeks orders.user_id', 'CREATE INDEX idx_orders_user ON orders(user_id);'],
  ['Hapus semua indeks', 'DROP INDEX IF EXISTS idx_users_email;\nDROP INDEX IF EXISTS idx_orders_user;'],
];
// Arti setiap baris EXPLAIN QUERY PLAN SQLite dalam bahasa pelajar.
function planKind(d) {
  if (/AUTOMATIC/.test(d)) return ['warn', 'Indeks sementara, dibuat ulang setiap query'];
  if (/^SCAN .*USING (COVERING )?INDEX/.test(d)) return ['warn', 'Membaca seluruh indeks'];
  if (/^SCAN/.test(d)) return ['scan', 'Membaca seluruh tabel'];
  if (/^SEARCH/.test(d)) return ['idx', 'Langsung ke baris lewat indeks'];
  if (/TEMP B-TREE/.test(d)) return ['warn', 'Mengurutkan atau mengelompokkan di memori'];
  return ['', ''];
}
const fmtMs = ms => ms < .1 ? '< 0,1 ms' : ms.toLocaleString('id-ID', {maximumFractionDigits: ms < 10 ? 1 : 0}) + ' ms';

function viewLabSql(box) {
  let db = null, alive = true;
  const runs = [], done = new Set();
  const TASKS = [
    'Cari satu user lewat email. Rencana eksekusinya membaca seluruh tabel users.',
    'Buat indeks di kolom email.',
    'Jalankan lagi pencarian yang sama. Sekarang rencananya lewat indeks, dan waktunya turun jauh.',
    'Gabungkan users dan orders, lalu buat indeks di orders(user_id) agar join tidak membaca seluruh tabel orders.',
  ];
  box.innerHTML = `<div class="lab-body">
    <div class="side">
      <section class="panel" aria-labelledby="h-q"><h2 id="h-q">Query</h2>
        <label class="skip" for="sql-ed">Teks SQL</label>
        <textarea id="sql-ed" class="sql-ed" spellcheck="false">${esc(SQL_EX[0][1])}</textarea>
        <div class="row" style="margin-top:10px"><button class="btn pri" id="sql-run" disabled>${ico(I.play)}Jalankan</button><span class="muted small">atau Ctrl + Enter</span><button class="btn ghost sm" id="sql-reset" disabled style="margin-left:auto">Reset database</button></div>
        <div class="cli-ex" style="margin-top:12px"><span class="muted">Contoh</span>${SQL_EX.map(([n, q]) => `<button class="chip" data-sql="${esc(q)}">${n}</button>`).join('')}</div>
      </section>
      <section class="panel" aria-labelledby="h-res"><h2 id="h-res">Hasil</h2><div id="sql-out" aria-live="polite"><p class="muted" id="sql-status">Memuat SQLite...</p></div></section>
    </div>
    <div class="side">
      <section class="panel" aria-labelledby="h-runs"><h2 id="h-runs">Waktu eksekusi</h2><ul class="runs" id="sql-runs"><li class="muted">Jalankan query untuk membandingkan waktunya di sini.</li></ul></section>
      <section class="panel" aria-labelledby="h-lt"><h2 id="h-lt">Latihan</h2><ul class="checks" id="lab-checks"></ul></section>
      <section class="panel" aria-labelledby="h-sch"><h2 id="h-sch">Skema</h2><div id="sql-schema" class="small"></div></section>
    </div></div>`;
  const ed = $('#sql-ed', box), outEl = $('#sql-out', box);
  const renderChecks = () => { $('#lab-checks', box).innerHTML = TASKS.map((t, i) => `<li class="${done.has(i) ? 'pass' : 'todo'}">${ico(done.has(i) ? I.check : I.dot)}<span>${t}</span></li>`).join(''); };
  const one = q => db.exec(q)[0]?.values || [];
  function renderSchema() {
    const tables = one("SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name").map(r => r[0]);
    const idx = one("SELECT name, tbl_name, sql FROM sqlite_master WHERE type = 'index' AND sql IS NOT NULL ORDER BY name");
    $('#sql-schema', box).innerHTML = tables.map(t => {
      const cols = one(`SELECT name FROM pragma_table_info('${t.replace(/'/g, "''")}')`).map(r => r[0]), n = one(`SELECT COUNT(*) FROM "${t.replace(/"/g, '""')}"`)[0][0];
      const ix = idx.filter(r => r[1] === t);
      return `<div class="sch"><b class="mono">${esc(t)}</b> <span class="muted num">${fmt(n)} baris</span><div class="mono muted">${cols.map(esc).join(', ')}</div>${ix.map(r => `<div class="sch-ix">${ico(I.check)}<span class="mono">${esc(r[0])}</span></div>`).join('')}</div>`;
    }).join('');
    if (idx.some(r => r[1] === 'users' && /\(\s*email\b/i.test(r[2]))) done.add(1);
  }
  function renderRuns() {
    const max = Math.max(...runs.map(r => r.ms), .1);
    $('#sql-runs', box).innerHTML = runs.map(r => `<li class="${r.kind}"><code title="${esc(r.sql)}">${esc(r.sql)}</code><span class="bar"><i style="width:${Math.max(1, r.ms / max * 100).toFixed(1)}%"></i><b class="num">${fmtMs(r.ms)}</b></span></li>`).join('');
  }
  function planTree(rows) { // [id, parent, notused, detail]
    const kids = p => rows.filter(r => r[1] === p);
    const ul = p => kids(p).length ? `<ul>${kids(p).map(r => { const [k, txt] = planKind(r[3]); return `<li><span class="p ${k}"><span class="mono">${esc(r[3])}</span>${txt ? `<small>${txt}</small>` : ''}</span>${ul(r[0])}</li>`; }).join('')}</ul>` : '';
    return `<div class="plan">${ul(0)}</div>`;
  }
  function run() {
    const sql = ed.value.trim(); if (!sql || !db) return;
    let res = null, last = null, err = null;
    const t0 = performance.now();
    try {
      // shortcut: query tanpa batas (misalnya CTE rekursif tanpa henti) bisa membekukan tab; cukup untuk lab pribadi di browser.
      for (const st of db.iterateStatements(sql)) {
        const cols = st.getColumnNames(), rows = []; let n = 0;
        while (st.step()) if (n++ < 100) rows.push(st.get());
        if (cols.length) { res = {cols, rows, n}; last = st.getSQL(); }
      }
    } catch (e) { err = e.message; }
    const ms = performance.now() - t0;
    let plan = [];
    if (last && !err) try { plan = one('EXPLAIN QUERY PLAN ' + last); } catch {}
    const kinds = plan.map(r => planKind(r[3])[0]);
    if (!err) runs.push({sql: sql.replace(/\s+/g, ' '), ms, kind: kinds.includes('scan') ? 'scan' : kinds.includes('idx') ? 'idx' : ''});
    if (runs.length > 6) runs.shift();
    const emailQ = plan.some(r => /\busers\b/.test(r[3]) || /^(SCAN|SEARCH) u\b/.test(r[3])) && /email\s*=/i.test(sql);
    if (emailQ && plan.some(r => /^SCAN (users|u)\b/.test(r[3]) && !/INDEX/.test(r[3]))) done.add(0);
    if (emailQ && done.has(1) && plan.some(r => /^SEARCH .*USING (COVERING )?INDEX .*\(email=\?\)/.test(r[3]))) done.add(2);
    if (plan.some(r => /^SEARCH .*USING (COVERING )?INDEX .*\(user_id=\?\)/.test(r[3]) && !/AUTOMATIC/.test(r[3]))) done.add(3);
    outEl.innerHTML = err ? `<p class="qres no">${esc(err)}</p>`
      : (plan.length ? `<h3 class="sub-h">Rencana eksekusi</h3>${planTree(plan)}` : '')
      + `<p class="muted small res-meta">${res ? `${fmt(res.n)} baris${res.n > 100 ? ', 100 pertama ditampilkan' : ''}` : 'Perintah selesai'}, ${fmtMs(ms)}</p>`
      + (res && res.cols.length ? `<div class="res-tbl"><table><thead><tr>${res.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${res.rows.map(r => `<tr>${r.map(v => `<td${typeof v === 'number' ? ' class="num"' : ''}>${v === null ? '<span class="muted">NULL</span>' : esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '');
    renderSchema(); renderRuns(); renderChecks();
  }
  async function boot() {
    $('#sql-run', box).disabled = $('#sql-reset', box).disabled = true;
    try {
      const SQL = await loadSqlJs(); if (!alive) return;
      $('#sql-status', box).textContent = 'Mengisi 100.000 user dan 300.000 pesanan...';
      await new Promise(r => setTimeout(r, 30)); // beri waktu teks status tampil sebelum pengisian yang memblokir
      db?.close(); db = new SQL.Database(); db.exec(SQL_SEED);
      if (!alive) return db.close();
      $('#sql-run', box).disabled = $('#sql-reset', box).disabled = false;
      outEl.innerHTML = '<p class="muted">Database siap. Jalankan query di kiri.</p>';
      renderSchema();
    } catch (e) { outEl.innerHTML = `<p class="qres no">${esc(e.message)}</p><button class="btn" data-retry>Coba lagi</button>`; }
  }
  box.onclick = e => {
    const ex = e.target.closest('[data-sql]');
    if (ex) { ed.value = ex.dataset.sql; ed.focus(); }
    else if (e.target.closest('#sql-run')) run();
    else if (e.target.closest('#sql-reset')) { runs.length = 0; renderRuns(); outEl.innerHTML = '<p class="muted">Menyiapkan ulang database...</p>'; boot(); }
    else if (e.target.closest('[data-retry]')) boot();
  };
  ed.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } };
  renderChecks(); boot();
  return () => { alive = false; db?.close(); };
}

const analytics = (() => {
  const ls = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch { return null; } };
  let vid = null, sid = null;
  const a = {
    q: [], timer: 0, errors: 0,
    get enabled() { return navigator.doNotTrack !== '1' && navigator.globalPrivacyControl !== true && ls('alur-noanalytics') !== '1'; },
    set enabled(on) { ls('alur-noanalytics', on ? '0' : '1'); if (!on) a.q.length = 0; },
    send: SB_ON ? body => fetch(`${CFG.supabaseUrl}/rest/v1/events`, {method: 'POST', keepalive: true, body,
      headers: {apikey: CFG.supabaseAnonKey, Authorization: `Bearer ${CFG.supabaseAnonKey}`, 'Content-Type': 'application/json', Prefer: 'return=minimal'}}) : null,
    track(name, props = {}) {

      a.q.push({name, vid, sid, props});

      if (a.q.length >= 20) a.flush(); else a.timer = setTimeout(a.flush, 5000);
    },
    flush() {
      clearTimeout(a.timer);
      if (a.q.length) a.send(JSON.stringify(a.q.splice(0, 50))).catch(() => {}); // statistik boleh hilang; jangan ganggu user
    },

})();
