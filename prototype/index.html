<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alur</title>
<meta name="description" content="Belajar system design lewat animasi dan playground">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#EBEEF2; --surface:#FFFFFF; --sunk:#DFE4EA; --ink:#17202B; --ink-2:#566274; --rule:#D2D8E0; --edge:#B4BDC9; --dot:#CDD3DB;
  --focus:#2B6CE0;
  --c-fondasi:#2B6CE0; --c-jaringan:#8350E8; --c-storage:#0C9682; --c-cache:#D48C06; --c-msg:#DB4157; --c-scale:#3A963A; --c-case:#5B6472;
  --ok:#2E9E5B; --warn:#D48C06; --bad:#D63A4E;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --t-fast:120ms; --t-med:220ms; --ease:cubic-bezier(.2,.7,.2,1);
  --font:"Overpass",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Overpass Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#0E131A; --surface:#161D26; --sunk:#1F2833; --ink:#E6EBF1; --ink-2:#98A4B5; --rule:#28323F; --edge:#3D4959; --dot:#242D39; --focus:#6B9BFF;
  --c-fondasi:#5B8EF5; --c-jaringan:#A07CF7; --c-storage:#2BB7A1; --c-cache:#F0AA2A; --c-msg:#F06478; --c-scale:#5CB85C; --c-case:#8D97A6;
  --ok:#4CC27E; --warn:#F0AA2A; --bad:#F2596B; color-scheme:dark;
}}
:root[data-theme=dark]{
  --paper:#0E131A; --surface:#161D26; --sunk:#1F2833; --ink:#E6EBF1; --ink-2:#98A4B5; --rule:#28323F; --edge:#3D4959; --dot:#242D39; --focus:#6B9BFF;
  --c-fondasi:#5B8EF5; --c-jaringan:#A07CF7; --c-storage:#2BB7A1; --c-cache:#F0AA2A; --c-msg:#F06478; --c-scale:#5CB85C; --c-case:#8D97A6;
  --ok:#4CC27E; --warn:#F0AA2A; --bad:#F2596B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:400 15px/1.6 var(--font);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,fieldset{margin:0;padding:0}
fieldset{border:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:4px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-999px;top:8px;z-index:99;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:var(--r-s)}
.skip:focus{left:8px}

/* Shell */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);grid-template-rows:64px auto;min-height:100vh}
.top{grid-column:1/-1;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--rule)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:23px;letter-spacing:-.02em;text-decoration:none;min-width:140px}
.logo svg{width:30px;height:30px}
.search{flex:1;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 14px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);color:var(--ink-2)}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in oklab,var(--focus) 22%,transparent)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
kbd{font:500 12px var(--mono);border:1px solid var(--rule);border-radius:5px;padding:1px 7px;color:var(--ink-2)}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:none;cursor:pointer;color:var(--ink);transition:background var(--t-fast)}
.ib:hover{background:var(--sunk)}
.rail{grid-row:2;position:sticky;top:64px;height:calc(100vh - 64px);display:flex;flex-direction:column;gap:4px;padding:12px 8px}
.rail a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border-radius:var(--r-m);font-size:11.5px;font-weight:600;color:var(--ink-2);text-decoration:none;transition:background var(--t-fast)}
.rail a:hover{background:var(--sunk)}
.rail a[aria-current=page]{background:var(--surface);color:var(--ink)}
main{grid-row:2;min-width:0;padding:24px 28px 96px}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:60px auto}
  .top{padding:0 12px 0 16px;gap:10px}
  .logo{min-width:0} .search kbd{display:none}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;z-index:30;flex-direction:row;justify-content:space-around;padding:4px 6px calc(4px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--rule)}
  .rail a{flex:1;padding:6px 2px}
  main{grid-column:1;padding:18px 16px 96px}
}
@media (max-width:480px){.logo span{display:none}}

/* Buttons, chips, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background var(--t-fast),color var(--t-fast)}
.btn:hover{background:var(--sunk)}
.btn .ico{width:18px;height:18px}
.btn.pri,.btn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.pri:hover,.btn[aria-pressed=true]:hover{background:color-mix(in oklab,var(--ink) 84%,var(--paper))}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--sunk);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background var(--t-fast)}
.chip:hover{background:color-mix(in oklab,var(--sunk) 70%,var(--ink) 8%)}
.chip[data-line]::before{content:"";width:14px;height:5px;border-radius:3px;background:var(--cat)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.seg-ctl{display:inline-flex;padding:3px;border-radius:999px;background:var(--sunk);flex:none}
.seg-ctl button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:0;border-radius:999px;background:none;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg-ctl button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.lv{width:14px;height:14px;flex:none}
select,input[type=text],textarea{border:1px solid var(--rule);border-radius:var(--r-s);background:var(--surface);padding:7px 10px}
textarea{width:100%;resize:vertical;line-height:1.5}
input[type=range]{accent-color:var(--ink);width:100%}
.lbl-s{font-size:13px;font-weight:700;color:var(--ink-2)}

/* Home */
.hero{display:grid;gap:16px;margin-bottom:30px}
.hero-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.hero h1{font-size:clamp(28px,3.4vw,42px);line-height:1.08;font-weight:800;letter-spacing:-.025em}
.hero-head p{color:var(--ink-2);max-width:54ch;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.map-wrap{background:var(--surface);border-radius:var(--r-l);overflow-x:auto;overscroll-behavior-x:contain}
.map{display:block;width:100%;min-width:860px;height:auto}
.mline{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.map text{font:600 11.5px var(--font);fill:var(--ink-2);text-anchor:middle}
.map .mname{font-size:13px;font-weight:800;fill:var(--ink);text-anchor:start}
.map .mstart{text-anchor:middle}
.map a{outline:none;cursor:pointer}
.map .hit{fill:transparent}
.map a:hover text,.map a:focus-visible text{fill:var(--ink)}
.map a:focus-visible .hit{stroke:var(--focus);stroke-width:2.5}
.map .st.done text{fill:var(--ink);font-weight:800}
.origin{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.train{fill:var(--surface);stroke-width:2.5}
.filters{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.filters .chips{flex:1 1 420px;min-width:0}
.count{font-size:13.5px;color:var(--ink-2);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:30px 20px}
.card{position:relative;content-visibility:auto;contain-intrinsic-size:auto 290px}
.thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:var(--r-m);overflow:hidden;contain:paint}
.thumb,.stage-wrap,.cv-wrap{background-color:color-mix(in oklab,var(--cat,var(--c-case)) 7%,var(--surface));background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:12px 12px}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.dur{position:absolute;left:8px;top:8px;padding:1px 7px;border-radius:5px;background:rgb(14 19 26 / .84);color:#fff;font-size:12px;font-weight:700}
.prog{position:absolute;left:0;bottom:0;width:100%;height:4px;background:var(--cat);transform-origin:left;transform:scaleX(var(--p))}
.meta{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:12px;padding-top:12px}
.card-line{border-radius:3px;background:var(--cat)}
.card h3{font-size:16px;line-height:1.35;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card h3 a{text-decoration:none}
.card h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:4px;color:var(--ink-2);font-size:13.5px}
.sub .lvl{display:inline-flex;align-items:center;gap:5px}
.save{width:36px;height:36px;margin:-6px -6px 0 0;border-radius:50%;border:0;background:none;color:var(--ink-2);cursor:pointer;opacity:0;transition:opacity var(--t-fast)}
.card:hover .save,.save:focus-visible,.save[aria-pressed=true]{opacity:1}
.save[aria-pressed=true] .ico,[data-save][aria-pressed=true] .ico{fill:currentColor}
@media (hover:none){.save{opacity:1}}
.empty{grid-column:1/-1;display:grid;justify-items:start;gap:12px;padding:40px 0;color:var(--ink-2);max-width:52ch}
.page-head{margin-bottom:24px}
.page-head h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.page-head p{color:var(--ink-2);margin-top:4px;max-width:60ch}

/* Diagram (thumbnail + player) */
.edge{stroke:var(--edge);stroke-width:1.6;transition:stroke var(--t-med)}
.stage .edge.on{stroke:var(--ink-2)}
.edge.cut{stroke:var(--bad);stroke-dasharray:4 4}
.node{transition:opacity var(--t-med)}
.node .shape{fill:color-mix(in oklab,var(--tc) 13%,var(--surface));stroke:var(--tc);stroke-width:1.6;transition:fill var(--t-med),stroke-width var(--t-med)}
.node .slots{stroke:var(--tc);stroke-width:1.4}
.node text{font-family:var(--font);font-size:9.5px;font-weight:700;fill:var(--ink);text-anchor:middle}
.node.hl .shape{fill:color-mix(in oklab,var(--tc) 34%,var(--surface));stroke-width:2.6}
.node.down{opacity:.3}
.pk,.pp{fill:var(--ink)}
.pk.bad,.pp.bad{fill:var(--bad)}
.pk{animation:pk 1.6s linear infinite paused;transform:translate(var(--x1),var(--y1))}
.pk.bad{animation-name:pkbad}
@keyframes pk{from{transform:translate(var(--x1),var(--y1))}to{transform:translate(var(--x2),var(--y2))}}
@keyframes pkbad{from{transform:translate(var(--x1),var(--y1));opacity:1}60%{opacity:1}to{transform:translate(var(--x2),var(--y2));opacity:0}}
.card:hover .pk,.card:focus-within .pk,.next-item:hover .pk,.next-item:focus-visible .pk,.live .pk{animation-play-state:running}

/* Lesson */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;max-width:1480px}
@media (max-width:1120px){.watch{grid-template-columns:minmax(0,1fr)}}
.player{border-radius:var(--r-l);overflow:hidden;background:var(--surface)}
.player:focus-visible{outline-offset:3px;border-radius:var(--r-l)}
.stage-wrap{aspect-ratio:16/9}
.stage{display:block;width:100%;height:100%}
.cap{display:grid;gap:2px;padding:14px 20px 4px;min-height:84px}
.cap b{font-size:18px;line-height:1.3}
.cap span{color:var(--ink-2);max-width:72ch}
.ctrl{display:flex;align-items:center;gap:4px;padding:6px 10px 10px}
.tl{flex:1;display:flex;gap:4px;align-items:center;height:28px;margin:0 8px;min-width:80px}
.seg{position:relative;flex:1;height:6px;padding:0;border:0;border-radius:3px;background:var(--rule);overflow:hidden;cursor:pointer;transition:transform var(--t-fast)}
.seg:hover{transform:scaleY(1.7)}
.seg i{position:absolute;inset:0;background:var(--cat);transform-origin:left;transform:scaleX(0)}
.time{font-size:13px;color:var(--ink-2);min-width:76px;text-align:right}
.spd{font-weight:700;font-size:13px;width:48px;border-radius:999px}
.w-title{font-size:clamp(22px,2.4vw,28px);line-height:1.2;font-weight:800;letter-spacing:-.015em;margin:18px 0 10px}
.w-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.w-bar .sub{margin:0}
.line-tag{display:inline-flex;align-items:center;gap:7px;font-weight:700;color:var(--ink)}
.line-tag::before{content:"";width:16px;height:5px;border-radius:3px;background:var(--cat)}
.w-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:24px 0 18px;overflow-x:auto}
.tab{flex:none;border:0;background:none;padding:10px 14px;font-weight:700;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--cat)}
.prose{max-width:70ch}
.prose .lead{font-size:17px;line-height:1.6}
.prose h2{font-size:17px;font-weight:800;margin:26px 0 8px}
.prose ul{padding-left:20px;display:grid;gap:6px}
.steps{list-style:none;display:grid;gap:4px}
.steps button{display:grid;grid-template-columns:52px 1fr;gap:2px 12px;width:100%;padding:10px 12px;border:0;border-radius:var(--r-m);background:none;text-align:left;cursor:pointer}
.steps button:hover{background:var(--sunk)}
.steps button[aria-current=step]{background:var(--surface)}
.steps .num{grid-row:span 2;color:var(--ink-2);font-size:13px;padding-top:2px}
.steps span:last-child{color:var(--ink-2)}
.quiz{display:grid;gap:14px;max-width:62ch}
.quiz legend{font-weight:700;font-size:17px;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--rule);border-radius:var(--r-m);background:var(--surface);cursor:pointer;margin-bottom:8px}
.opt:has(input:checked){border-color:var(--ink)}
.opt input{margin-top:5px;accent-color:var(--ink)}
.qres{font-weight:700;min-height:1.6em}
.qres.ok{color:var(--ok)} .qres.no{color:var(--bad)}
.quiz .btn{justify-self:start}
.mynotes{display:grid;gap:10px;max-width:62ch}
.mynotes .btn{justify-self:start}
.note-list{list-style:none;display:grid;gap:8px;margin-top:8px}
.note-list li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:10px 12px;background:var(--surface);border-radius:var(--r-m)}
.note-list .tlink{border:0;background:var(--sunk);border-radius:5px;padding:2px 8px;font-size:13px;font-weight:700;cursor:pointer}
.muted{color:var(--ink-2)}
.next h2{font-size:16px;font-weight:800;margin-bottom:12px}
.next-list{display:grid;gap:12px}
.next-item{display:grid;grid-template-columns:168px minmax(0,1fr);gap:12px;text-decoration:none;border-radius:var(--r-m)}
.next-item .thumb{border-radius:8px}
.next-item b{font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.next-item .sub{font-size:12.5px;gap:2px 10px}
.next-item:hover b{text-decoration:underline;text-underline-offset:3px}

/* Playground */
.pg-bar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:18px 0 16px}
.fld{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.fld.rps{flex:1 1 300px;max-width:440px}
.fld output{min-width:86px;font-weight:800}
.fld-col{display:grid;gap:6px;font-size:13.5px;font-weight:600;margin-top:14px}
.fld-col output{font-weight:800;justify-self:end;margin-top:-26px}
.pg-body{display:grid;grid-template-columns:176px minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1180px){.pg-body{grid-template-columns:minmax(0,1fr)}.palette{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.palette .lbl-s{grid-column:1/-1}}
.palette{display:grid;gap:6px}
.pal{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--rule);border-radius:var(--r-m);background:var(--surface);text-align:left;cursor:pointer;transition:background var(--t-fast)}
.pal:hover{background:var(--sunk)}
.pal svg{width:44px;height:20px}
.pal b{display:block;font-size:13.5px;line-height:1.2}
.pal small{color:var(--ink-2);font-size:11.5px}
.cv-wrap{position:relative;border-radius:var(--r-l);overflow:hidden}
.cv-wrap canvas{display:block;width:100%;touch-action:none;cursor:grab}
.cv-wrap canvas.connecting{cursor:crosshair}
.cv-hint{position:absolute;left:12px;bottom:10px;right:12px;font-size:13px;color:var(--ink-2);pointer-events:none}
.side{display:grid;gap:12px}
.panel{background:var(--surface);border-radius:var(--r-l);padding:16px}
.panel h2{font-size:15px;font-weight:800;margin-bottom:10px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric b{display:block;font-size:22px;line-height:1.2;font-weight:800}
.metric span{font-size:12.5px;color:var(--ink-2)}
.metric.bad b{color:var(--bad)}
.advice{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);font-size:13.5px}
.checks{list-style:none;display:grid;gap:6px;margin-top:10px;font-size:13.5px}
.checks li{display:flex;gap:8px;align-items:center}
.checks .ico{width:16px;height:16px}
.checks .pass{color:var(--ok)} .checks .fail{color:var(--bad)}
.win{margin-top:10px;font-weight:800;color:var(--ok)}
.conns{list-style:none;display:grid;gap:4px;margin-top:6px;font-size:14px}
.conns li{display:flex;justify-content:space-between;align-items:center;gap:8px}
#pg-del{margin-top:16px}

/* Design system page */
.ds section{margin:0 0 48px;max-width:1100px}
.ds h2{font-size:21px;font-weight:800;margin-bottom:6px;letter-spacing:-.01em}
.ds .intro{color:var(--ink-2);max-width:64ch;margin-bottom:18px}
.princ{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.princ div{padding:16px 0 0;border-top:5px solid var(--cat)}
.princ b{display:block;font-size:16px;margin-bottom:4px}
.princ p{color:var(--ink-2);font-size:14px}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sw{background:var(--surface);border-radius:var(--r-m);overflow:hidden;font-size:13px}
.sw i{display:block;height:56px;background:var(--v);border-bottom:1px solid var(--rule)}
.sw div{padding:8px 10px}
.sw b{display:block}
.sw code{font-family:var(--mono);color:var(--ink-2);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.kv{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:10px 24px;align-items:baseline;background:var(--surface);border-radius:var(--r-m);padding:16px 18px}
.kv code{font-family:var(--mono);font-size:13px}
.kv span{color:var(--ink-2);font-size:14px}
.type-row{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--rule)}
.type-row small{color:var(--ink-2);font-size:12.5px}
.rules{display:grid;gap:10px;padding-left:20px;max-width:76ch}
.node-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.node-grid small{display:block;color:var(--ink-2);font-size:11.5px;line-height:1.4;margin-top:4px}
.tech-ex{font-size:13px;margin:-4px 0 12px}
.node-grid figure{margin:0;background:var(--surface);border-radius:var(--r-m);padding:10px;text-align:center;font-size:13px}
.node-grid svg{width:100%;height:44px}
.spc{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.spc div{display:grid;gap:4px;justify-items:center;font-size:12px;color:var(--ink-2)}
.spc i{display:block;background:var(--c-fondasi);border-radius:2px}


/* Akun */
#acct{flex:none}
.acct{overflow:hidden;padding:0;width:36px;height:36px;border:1px solid var(--rule)}
.acct img{width:100%;height:100%;object-fit:cover}
.acct .ini{font-weight:800}
dialog{border:0;border-radius:var(--r-l);background:var(--surface);color:var(--ink);padding:24px;width:min(420px,calc(100vw - 32px));box-shadow:0 20px 60px rgb(0 0 0 / .25)}
dialog::backdrop{background:rgb(14 19 26 / .45)}
dialog h2{font-size:21px;font-weight:800;margin-bottom:6px;padding-right:32px}
dialog .muted{margin-bottom:16px}
.dlg-x{position:absolute;top:12px;right:12px}
.oauth{display:grid;gap:8px}
.oauth .btn{height:44px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{margin-top:14px;font-size:13.5px;color:var(--ink-2);padding:10px 12px;border-radius:var(--r-s);background:var(--sunk)}
.rail a[hidden]{display:none}

/* Admin */
.adm section{margin-bottom:36px;max-width:1100px}
.adm-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.adm-head h2{font-size:21px;font-weight:800}
.adm-list{display:grid;gap:2px;background:var(--surface);border-radius:var(--r-l);padding:8px}
.adm-row{display:grid;grid-template-columns:5px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px;border-radius:var(--r-m)}
.adm-row:hover{background:var(--sunk)}
.adm-row .card-line{align-self:stretch}
.adm-dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.adm-card{display:grid;gap:8px;background:var(--surface);border-radius:var(--r-l);padding:10px}
.adm-card .thumb:hover .pk{animation-play-state:running}
.adm-card span{display:block;font-size:13px}
.back{font-size:14px;font-weight:600;color:var(--ink-2)}
.adm-edit{display:grid;grid-template-columns:minmax(0,560px) minmax(0,360px);gap:28px;align-items:start}
.adm-edit.wide{grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:1400px}
.adm-edit aside{position:sticky;top:84px;display:grid;gap:8px}
@media (max-width:980px){.adm-edit,.adm-edit.wide{grid-template-columns:minmax(0,1fr)}.adm-edit aside{position:static}}
.adm-form{display:grid;gap:16px}
.adm-form label{display:grid;gap:6px;font-weight:700;font-size:14px;flex:1 1 140px}
.adm-form small{font-weight:400;color:var(--ink-2);font-size:12.5px}
.adm-form input[type=text],.adm-form input[type=number]{border:1px solid var(--rule);border-radius:var(--r-s);background:var(--surface);padding:7px 10px;font:inherit;font-weight:400}
.adm-form input[readonly]{background:var(--sunk);color:var(--ink-2)}
.adm-form textarea{font-weight:400}
.adm-form .code{font:13px/1.55 var(--mono);white-space:pre;overflow-wrap:normal;overflow-x:auto}
.help summary{cursor:pointer;font-weight:700;font-size:14px}
.help .kv{margin-top:8px;grid-template-columns:auto 1fr}
.errs{color:var(--bad);font-size:14px;padding-left:18px;display:grid;gap:4px}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .pk{animation:none!important;transform:translate(calc((var(--x1) + var(--x2)) / 2),calc((var(--y1) + var(--y2)) / 2))}
  .train{display:none}
}

/* ---------- Shared renderers ---------- */
const nodeW = label => Math.max(72, Math.round(label.length * 5.4 + 18));
function shapeSVG(type, x, y, w = 72, h = 28) {
  const hw = w / 2, hh = h / 2;
  if (type === 'db') return `<path class="shape" d="M${x - hw},${y - hh + 4}v${h - 8}a${hw},4 0 0 0 ${w},0v${-(h - 8)}a${hw},4 0 0 0 ${-w},0a${hw},4 0 0 0 ${w},0"/>`;
  if (type === 'lb') return `<path class="shape" d="M${x - hw + 8},${y - hh}H${x + hw - 8}L${x + hw},${y}L${x + hw - 8},${y + hh}H${x - hw + 8}L${x - hw},${y}Z"/>`;
  if (type === 'cdn') return `<ellipse class="shape" cx="${x}" cy="${y}" rx="${hw}" ry="${hh}"/>`;
  const rx = type === 'client' || type === 'reject' ? hh : 5;
  let s = `<rect class="shape" x="${x - hw}" y="${y - hh}" width="${w}" height="${h}" rx="${rx}"/>`;
  if (type === 'queue') s += `<path class="slots" d="M${x + hw - 18},${y - 8}v16M${x + hw - 13},${y - 8}v16M${x + hw - 8},${y - 8}v16"/>`;
  return s;
}
const parseFlow = f => { const bad = f[0] === '!', [a, b] = f.replace('!', '').split('>'); return {a, b, bad}; };
function diagramSVG(id, thumb) {
  const D = typeof id === 'string' ? DG[id] : id, P = Object.fromEntries(D.nodes.map(n => [n[0], n]));
  const edges = D.edges.map(e => { const [a, b] = e.split('-'); return `<line class="edge" data-e="${e}" x1="${P[a][2]}" y1="${P[a][3]}" x2="${P[b][2]}" y2="${P[b][3]}"/>`; }).join('');
  let pk = '';
  if (thumb) {
    const s = D.steps.reduce((m, s) => s.f.length > m.f.length ? s : m);
    pk = s.f.map((f, i) => {
      const {a, b, bad} = parseFlow(f), A = P[a], B = P[b], k = bad ? .55 : 1;
      const x2 = A[2] + (B[2] - A[2]) * k, y2 = A[3] + (B[3] - A[3]) * k;
      return [0, 1].map(j => `<circle r="3.6" class="pk${bad ? ' bad' : ''}" style="--x1:${A[2]}px;--y1:${A[3]}px;--x2:${x2}px;--y2:${y2}px;animation-delay:${-(j * .8 + i * .27).toFixed(2)}s"/>`).join('');
    }).join('');
  }
  const nodes = D.nodes.map(([nid, type, x, y, label]) => `<g class="node" data-n="${nid}" style="--tc:var(${TYPES[type].v})">${shapeSVG(type, x, y, nodeW(label))}<text x="${x}" y="${y + (type === 'db' ? 5 : 3.5)}">${esc(label)}</text></g>`).join('');
  return `<svg viewBox="0 0 320 180" class="${thumb ? 'dg' : 'dg stage'}" ${thumb ? 'aria-hidden="true"' : 'role="img" aria-label="Diagram animasi"'}><g>${edges}</g><g class="pk-layer">${pk}</g>${nodes}</svg>`;
}
function lvShape(lv, x, y, s, fill, stroke, sw) {
  const a = `fill="${fill}" stroke="${stroke}" stroke-width="${sw}"`;
  if (lv === 0) return `<circle cx="${x}" cy="${y}" r="${s}" ${a}/>`;
  if (lv === 1) return `<circle cx="${x}" cy="${y}" r="${s}" ${a}/><circle cx="${x}" cy="${y}" r="${(s * .4).toFixed(1)}" fill="${stroke}"/>`;
  const k = s * .82;
  return `<rect x="${x - k}" y="${y - k}" width="${2 * k}" height="${2 * k}" rx="1.5" transform="rotate(45 ${x} ${y})" ${a}/>`;
}
const lvIcon = lv => `<svg class="lv" viewBox="0 0 16 16" aria-hidden="true">${lvShape(lv, 8, 8, 5, 'none', 'currentColor', 1.7)}</svg>`;
const prog = id => store.s.progress[id] || 0;

function cardHTML(l) {
  const p = prog(l.id), saved = store.s.saved.includes(l.id);
  return `<article class="card" style="--cat:var(${CAT[l.cat].v})">
    <a class="thumb" href="#/l/${l.id}" tabindex="-1" aria-hidden="true">${diagramSVG(l.dg, true)}<span class="dur num">${l.min} mnt</span>${p ? `<span class="prog" style="--p:${p}"></span>` : ''}</a>
    <div class="meta"><span class="card-line"></span><div><h3><a href="#/l/${l.id}">${esc(l.t)}</a></h3>
      <p class="sub"><span>${CAT[l.cat].name}</span><span class="lvl">${lvIcon(l.lv)}${LV[l.lv]}</span>${p >= 1 ? '<span>Selesai</span>' : ''}</p></div>
      <button class="save" data-save="${l.id}" aria-pressed="${saved}" aria-label="Simpan ${esc(l.t)}">${ico(I.bookmark)}</button></div>
  </article>`;
}

function mapSVG() {
  const gap = 40, top = 38, n = CATS.length, mid = top + gap * (n - 1) / 2, ox = 70, bend = 128, sx = 250, step = 160;
  let lines = '', trains = '', st = '';
  CATS.forEach((c, i) => {
    const y = top + i * gap, yb = mid + (i - (n - 1) / 2) * 8, dy = Math.abs(y - yb), ls = L.filter(l => l.cat === c.id);
    const end = sx + (ls.length - 1) * step + 44, d = `M${ox},${yb}H${bend}L${bend + dy},${y}H${end}`, col = `var(${c.v})`;
    lines += `<path d="${d}" stroke="${col}" class="mline"/><text class="mname" x="${end + 14}" y="${y + 4.5}">${c.name}</text>`;
    trains += `<rect class="train" x="-9" y="-4" width="18" height="8" rx="4" style="stroke:${col}"><animateMotion dur="${(13 + i * 1.3).toFixed(1)}s" begin="${-i * 2.3}s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear" path="${d}"/></rect>`;
    ls.forEach((l, j) => {
      const x = sx + j * step, done = prog(l.id) >= 1;
      st += `<a href="#/l/${l.id}" class="st${done ? ' done' : ''}" aria-label="${esc(l.t)}, ${LV[l.lv]}${done ? ', selesai' : ''}"><circle class="hit" cx="${x}" cy="${y}" r="13"/>${lvShape(l.lv, x, y, 6.5, done ? col : 'var(--surface)', 'var(--ink)', 2.2)}<text x="${x}" y="${y + 21}">${esc(l.s)}</text></a>`;
    });
  });
  const span = (n - 1) * 8 + 18, w = Math.max(990, sx + (Math.max(...CATS.map(c => L.filter(l => l.cat === c.id).length)) - 1) * step + 230);
  return `<svg class="map" viewBox="0 0 ${w} ${top * 2 + gap * (n - 1)}" style="min-width:${Math.round(w * .87)}px" role="group" aria-label="Peta belajar">${lines}<rect class="origin" x="${ox - 10}" y="${mid - span / 2}" width="20" height="${span}" rx="10"/><text class="mname mstart" x="${ox}" y="${mid - span / 2 - 10}">Mulai</text>${trains}${st}</svg>`;
}

const STEP = 6000;
function mountPlayer(el, D, onStep) {
  const steps = D.steps, total = steps.length * STEP, P = Object.fromEntries(D.nodes.map(n => [n[0], n]));
  const layer = $('.pk-layer', el), segs = $$('.seg i', el), playBtn = $('[data-act=play]', el), timeEl = $('.time', el), spdBtn = $('.spd', el);
  const pool = Array.from({length: 40}, () => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', '3.6'); c.setAttribute('class', 'pp'); c.style.display = 'none'; layer.append(c);
    return {el: c, live: false, k: 0, f: null};
  });
  let t = 0, playing = false, speed = 1, cur = -1, raf = 0, last = 0, flows = [], lastSec = -1, autoPaused = false;

  function clearPackets() { pool.forEach(p => { p.live = false; p.el.style.display = 'none'; }); }
  function apply(i) {
    cur = i; const s = steps[i];
    flows = s.f.map(f => { const {a, b, bad} = parseFlow(f); return {A: P[a], B: P[b], bad, acc: 650 - Math.random() * 300}; });
    const on = new Set(s.f.map(f => { const {a, b} = parseFlow(f); return D.edges.includes(`${a}-${b}`) ? `${a}-${b}` : `${b}-${a}`; }));
    $$('.node', el).forEach(n => { n.classList.toggle('hl', (s.h || []).includes(n.dataset.n)); n.classList.toggle('down', (s.x || []).includes(n.dataset.n)); });
    $$('.edge', el).forEach(e => { e.classList.toggle('on', on.has(e.dataset.e)); e.classList.toggle('cut', (s.cut || []).includes(e.dataset.e)); });
    $('.cap b', el).textContent = `${i + 1}. ${s.t}`;
    $('.cap span', el).textContent = s.d;
    onStep(i, steps.length);
  }
  function spawn(f) {
    const p = pool.find(p => !p.live); if (!p) return;
    p.live = true; p.k = 0; p.f = f; p.el.style.display = ''; p.el.style.opacity = 1;
    p.el.classList.toggle('bad', f.bad);
  }
  function draw(dt) {
    for (const f of flows) { f.acc += dt; if (f.acc >= 650) { f.acc = 0; spawn(f); } }
    for (const p of pool) {
      if (!p.live) continue;
      p.k += dt / 1100;
      const lim = p.f.bad ? .55 : 1;
      if (p.k >= lim) { p.live = false; p.el.style.display = 'none'; continue; }
      const {A, B} = p.f;
      p.el.setAttribute('transform', `translate(${A[2] + (B[2] - A[2]) * p.k} ${A[3] + (B[3] - A[3]) * p.k})`);
      if (p.f.bad) p.el.style.opacity = Math.max(0, 1 - Math.max(0, p.k - .3) / .25);
    }
  }
  function ui() {
    segs.forEach((s, j) => { s.style.transform = `scaleX(${Math.min(1, Math.max(0, (t - j * STEP) / STEP))})`; });
    const sec = Math.floor(t / 1000);
    if (sec !== lastSec) { lastSec = sec; timeEl.textContent = `${mmss(t)} / ${mmss(total)}`; }
  }
  function frame(now) {
    // Timestamp rAF bisa lebih awal dari performance.now() saat play(), jadi dt dijepit agar tidak negatif.
    const dt = Math.max(0, Math.min(now - last, 50)) * speed; last = now;
    t = Math.min(total, t + dt);
    const i = Math.min(steps.length - 1, Math.floor(t / STEP));
    if (i !== cur) apply(i);
    draw(dt); ui();
    if (t >= total) { pause(); onStep(steps.length, steps.length); return; }
    raf = requestAnimationFrame(frame);
  }
  function setBtn() { playBtn.innerHTML = ico(playing ? I.pause : I.play); playBtn.setAttribute('aria-label', playing ? 'Jeda' : 'Putar'); }
  function play() { if (playing) return; if (t >= total) { t = 0; clearPackets(); } playing = true; last = performance.now(); raf = requestAnimationFrame(frame); setBtn(); }
  function pause() { playing = false; cancelAnimationFrame(raf); setBtn(); }
  function seek(i) { i = Math.max(0, Math.min(steps.length - 1, i)); t = i * STEP; clearPackets(); apply(i); ui(); }

  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.seek) seek(+b.dataset.seek);
    else if (b.dataset.act === 'play') playing ? pause() : play();
    else if (b.dataset.act === 'prev') seek(cur - 1);
    else if (b.dataset.act === 'next') seek(cur + 1);
    else if (b.dataset.act === 'speed') { speed = {0.5: 1, 1: 1.5, 1.5: 2, 2: 0.5}[speed]; spdBtn.textContent = `${speed.toLocaleString('id-ID')}×`; }
  });
  el.addEventListener('keydown', e => {
    if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(cur - 1); }
  });
  // Berhenti saat player keluar layar, lanjut lagi saat kembali.
  const io = new IntersectionObserver(([e]) => {
    if (!e.isIntersecting && playing) { autoPaused = true; pause(); }
    else if (e.isIntersecting && autoPaused) { autoPaused = false; play(); }
  }, {threshold: .25});
  io.observe(el);
  seek(0); setBtn();
  if (!reduced) play();
  return {seek: i => { seek(i); play(); }, time: () => t, seekTime: ms => { t = Math.min(ms, total - 1); clearPackets(); apply(Math.floor(t / STEP)); ui(); }, destroy() { pause(); io.disconnect(); }};
}

/* ---------- Playground ---------- */
const PG = {
  client: {cap: Infinity, ms: 0, cost: 0},
  lb: {cap: 20000, ms: 1, cost: 20},
  server: {cap: 1500, ms: 25, cost: 70},
  cache: {cap: 25000, ms: 1, cost: 50, hit: .8},
  db: {cap: 2500, ms: 12, cost: 200},
  queue: {cap: 30000, ms: 2, cost: 30},
  cdn: {cap: 200000, ms: 4, cost: 40, hit: .9},
};
const TERMINAL = new Set(['server', 'db']);
const W = 900, H = 520, NW = 124, NH = 56;

// shortcut: model aliran steady-state (bukan simulasi event diskret); cukup untuk intuisi, ganti dengan sim per-request untuk materi p99.
function simulate(g, rps) {
  const st = {}, kids = {}, indeg = {}, by = {};
  g.nodes.forEach(n => { st[n.id] = {in: 0, drop: 0, backlog: 0, rho: 0}; kids[n.id] = []; indeg[n.id] = 0; by[n.id] = n; });
  g.edges.forEach(([a, b]) => { kids[a].push(b); indeg[b]++; });
  const order = [], q = g.nodes.filter(n => !indeg[n.id]).map(n => n.id);
  while (q.length) { const id = q.shift(); order.push(id); kids[id].forEach(k => { if (!--indeg[k]) q.push(k); }); }
  const clients = g.nodes.filter(n => n.type === 'client');
  clients.forEach(n => { st[n.id].in = rps / clients.length; });
  const edgeFlow = {};
  for (const id of order) {
    const n = by[id], s = st[id], ks = kids[id];
    const served = Math.min(s.in, n.cap);
    s.drop = s.in - served; s.rho = isFinite(n.cap) ? s.in / n.cap : 0;
    const fwd = served * (1 - (n.hit || 0));
    if (!ks.length) { if (!TERMINAL.has(n.type)) s.drop += fwd; continue; }
    if (n.type === 'queue') {
      // Queue hanya meneruskan sebanyak yang sanggup diproses worker; sisanya menumpuk, bukan ditolak.
      const kcap = ks.reduce((a, k) => a + by[k].cap, 0), send = Math.min(fwd, kcap);
      s.backlog = fwd - send;
      ks.forEach(k => { const f = send * (isFinite(kcap) ? by[k].cap / kcap : 1 / ks.length); st[k].in += f; edgeFlow[id + '>' + k] = f; });
    } else ks.forEach(k => { const f = fwd / ks.length; st[k].in += f; edgeFlow[id + '>' + k] = f; });
  }
  const Lt = {};
  for (const id of [...order].reverse()) {
    const n = by[id], ks = kids[id];
    const own = PG[n.type].ms / (1 - Math.min(st[id].rho, .95));
    const down = n.type === 'queue' || !ks.length ? 0 : ks.reduce((a, k) => a + Lt[k], 0) / ks.length;
    Lt[id] = own + (1 - (n.hit || 0)) * down;
  }
  const drop = g.nodes.reduce((a, n) => a + st[n.id].drop, 0);
  return {
    st, edgeFlow, drop, ok: rps - drop, err: rps ? drop / rps : 0,
    lat: clients.length ? clients.reduce((a, n) => a + Lt[n.id], 0) / clients.length : 0,
    cost: g.nodes.reduce((a, n) => a + (isFinite(n.cap) ? PG[n.type].cost * n.cap / PG[n.type].cap : 0), 0),
    backlog: g.nodes.reduce((a, n) => a + st[n.id].backlog, 0),
  };
}
(function selfTest() {
  const T = (types, edges, rps) => simulate({nodes: types.map((t, i) => ({id: 'n' + i, type: t, cap: PG[t].cap, hit: PG[t].hit})), edges: edges.map(([a, b]) => ['n' + a, 'n' + b])}, rps);
  let r = T(['client', 'lb', 'server', 'server'], [[0, 1], [1, 2], [1, 3]], 2000);
  console.assert(r.st.n2.in === 1000 && r.err === 0, 'sim: load balancer membagi rata');
  r = T(['client', 'server'], [[0, 1]], 3000);
  console.assert(r.drop === 1500 && r.err === .5, 'sim: server kelebihan beban menolak sisa');
  r = T(['client', 'cache', 'db'], [[0, 1], [1, 2]], 1000);
  console.assert(Math.abs(r.st.n2.in - 200) < 1e-9, 'sim: cache hit 80% menyisakan 20% ke database');
  r = T(['client', 'queue', 'server'], [[0, 1], [1, 2]], 3000);
  console.assert(r.st.n2.in === 1500 && r.backlog === 1500 && r.drop === 0, 'sim: queue menumpuk, tidak menolak');
  r = T(['client', 'lb'], [[0, 1]], 100);
  console.assert(r.drop === 100, 'sim: request ke jalan buntu dihitung hilang');
})();

function buildGraph(spec, links) {
  const g = {nodes: [], edges: []};
  spec.forEach(([type, x, y]) => g.nodes.push(mkNode(type, x, y, g)));
  links.forEach(([a, b]) => g.edges.push([g.nodes[a].id, g.nodes[b].id]));
  return g;
}
let nid = 0;
function mkNode(type, x, y, g) {
  const k = g.nodes.filter(n => n.type === type).length + 1;
  return {id: type + ++nid, type, x, y, cap: PG[type].cap, hit: PG[type].hit, name: type === 'client' ? 'Client' : `${TYPES[type].name} ${k}`};
}
const PRESETS = {
  single: {name: 'Satu server', build: () => buildGraph([['client', 90, 260], ['server', 450, 260], ['db', 800, 260]], [[0, 1], [1, 2]])},
  lb: {name: 'Load balancer', build: () => buildGraph([['client', 80, 260], ['lb', 270, 260], ['server', 470, 110], ['server', 470, 260], ['server', 470, 410], ['db', 790, 260]], [[0, 1], [1, 2], [1, 3], [1, 4], [2, 5], [3, 5], [4, 5]])},
  cache: {name: 'Dengan cache', build: () => buildGraph([['client', 70, 260], ['lb', 230, 260], ['server', 405, 110], ['server', 405, 260], ['server', 405, 410], ['cache', 605, 260], ['db', 805, 260]], [[0, 1], [1, 2], [1, 3], [1, 4], [2, 5], [3, 5], [4, 5], [5, 6]])},
  queue: {name: 'Queue dan worker', build: () => buildGraph([['client', 90, 260], ['lb', 300, 260], ['queue', 520, 260], ['server', 780, 150], ['server', 780, 370]], [[0, 1], [1, 2], [2, 3], [2, 4]])},
  cdn: {name: 'CDN di depan', build: () => buildGraph([['client', 70, 260], ['cdn', 235, 260], ['lb', 405, 260], ['server', 590, 160], ['server', 590, 360], ['db', 805, 260]], [[0, 1], [1, 2], [2, 3], [2, 4], [3, 5], [4, 5]])},
};
const CHALLENGES = [
  {name: 'Tahan 3.000 rps', d: 'Toko online kecil sedang promo. Layani 3.000 request per detik dengan sedikit kegagalan.', rps: 3000, err: .01, lat: 150, cost: Infinity},
  {name: '10.000 rps dengan anggaran tipis', d: 'Sebagian besar trafik adalah halaman produk yang sama untuk semua user. Anggaran maksimal $800 per bulan.', rps: 10000, err: .01, lat: 100, cost: 800},
  {name: 'Flash sale 25.000 rps', d: 'Terima semua pesanan tanpa menolak satu pun. Pemrosesan boleh tertunda.', rps: 25000, err: .001, lat: 60, cost: Infinity},
];

function viewPlayground(presetId) {
  const pre = PRESETS[presetId] ? presetId : 'lb';
  let g = PRESETS[pre].build(), rps = 3000, chal = 0, running = !reduced, sel = null, connecting = false, from = null;
  let sim, packets = [], sparks = [], acc = [], raf = 0, last = 0, visible = true, drag = null, pointer = null, pal, scale = 1, dpr = 1;
  const types = ['client', 'lb', 'server', 'cache', 'db', 'queue', 'cdn'];
  view.innerHTML = `<div class="pg">
    <header class="page-head"><h1>Playground</h1><p>Rakit arsitektur, alirkan trafik, lalu lihat komponen mana yang pertama kewalahan. Angka di sini adalah model sederhana untuk membangun intuisi, bukan benchmark.</p></header>
    <div class="pg-bar">
      <label class="fld">Mulai dari <select id="pg-preset">${Object.entries(PRESETS).map(([k, p]) => `<option value="${k}"${k === pre ? ' selected' : ''}>${p.name}</option>`).join('')}</select></label>
      <label class="fld rps">Trafik <input id="pg-rps" type="range" min="100" max="30000" step="100" value="${rps}"><output id="pg-rps-out" class="num"></output></label>
      <button class="btn" id="pg-run" aria-pressed="${running}"></button>
      <button class="btn" id="pg-connect" aria-pressed="false">${ico(I.nodes)}Sambungkan</button>
    </div>
    <div class="pg-body">
      <div class="palette" role="group" aria-label="Tambah komponen"><p class="lbl-s">Tambah komponen</p>${types.map(t => `<button class="pal" data-add="${t}"><svg viewBox="0 0 84 34" aria-hidden="true"><g class="node" style="--tc:var(${TYPES[t].v})">${shapeSVG(t, 42, 17, 76, 28)}</g></svg><span><b>${TYPES[t].name}</b><small class="num">${isFinite(PG[t].cap) ? `${fmt(PG[t].cap)} rps, $${PG[t].cost}/bln` : 'Sumber trafik'}</small></span></button>`).join('')}</div>
      <div class="cv-wrap"><canvas id="pg-cv" aria-label="Kanvas arsitektur. Panel di kanan bisa dipakai untuk memilih dan menyambungkan komponen dengan keyboard."></canvas><p class="cv-hint" id="pg-hint"></p></div>
      <div class="side">
        <section class="panel" aria-labelledby="h-res"><h2 id="h-res">Hasil</h2><div class="metrics" id="pg-metrics" aria-live="polite"></div><p class="advice" id="pg-advice"></p></section>
        <section class="panel" aria-labelledby="h-chal"><h2 id="h-chal">Tantangan</h2><select id="pg-chal" aria-label="Pilih tantangan">${CHALLENGES.map((c, i) => `<option value="${i}">${c.name}${store.s.chal[i] ? ' (selesai)' : ''}</option>`).join('')}</select><p class="muted" id="pg-chal-d" style="margin-top:8px;font-size:13.5px"></p><ul class="checks" id="pg-checks"></ul></section>
        <section class="panel" id="pg-insp" aria-label="Pengaturan komponen"></section>
      </div>
    </div></div>`;
  const cv = $('#pg-cv'), ctx = cv.getContext('2d'), wrap = $('.cv-wrap', view);
  const byId = id => g.nodes.find(n => n.id === id);

  function readPal() {
    const cs = getComputedStyle(root), v = k => cs.getPropertyValue(k).trim();
    pal = {ink: v('--ink'), ink2: v('--ink-2'), surface: v('--surface'), sunk: v('--sunk'), edge: v('--edge'), bad: v('--bad'), ok: v('--ok'), warn: v('--warn'), focus: v('--focus'), t: Object.fromEntries(types.map(t => [t, v(TYPES[t].v)]))};
  }
  function reach(a, b) { // apakah b bisa dicapai dari a
    const seen = new Set([a]), st = [a];
    while (st.length) { const x = st.pop(); if (x === b) return true; g.edges.forEach(([p, q]) => { if (p === x && !seen.has(q)) { seen.add(q); st.push(q); } }); }
    return false;
  }
  const canLink = (a, b) => a !== b && b.type !== 'client' && !g.edges.some(([p, q]) => p === a.id && q === b.id) && !reach(b.id, a.id);

  function recompute() {
    sim = simulate(g, rps);
    const C = CHALLENGES[chal];
    $('#pg-rps-out').textContent = `${fmt(rps)} rps`;
    $('#pg-metrics').innerHTML = [
      ['Berhasil dilayani', `${fmt(sim.ok)} rps`, false],
      ['Ditolak', pct(sim.err), sim.err > .01],
      ['Latensi rata-rata', `${fmt(sim.lat)} ms`, sim.lat > 200],
      ['Biaya', `$${fmt(sim.cost)}/bln`, false],
    ].map(([k, v, bad]) => `<div class="metric${bad ? ' bad' : ''}"><b class="num">${v}</b><span>${k}</span></div>`).join('');
    $('#pg-advice').textContent = advice();
    $('#pg-chal-d').textContent = C.d;
    const rows = [[`Trafik minimal ${fmt(C.rps)} rps`, rps >= C.rps], [`Ditolak paling banyak ${pct(C.err)}`, sim.err <= C.err], [`Latensi paling lama ${C.lat} ms`, sim.lat <= C.lat]];
    if (isFinite(C.cost)) rows.push([`Biaya paling mahal $${fmt(C.cost)}/bln`, sim.cost <= C.cost]);
    const win = rows.every(r => r[1]);
    if (win && !store.s.chal[chal]) { store.s.chal[chal] = true; store.save(); }
    $('#pg-checks').innerHTML = rows.map(([k, ok]) => `<li class="${ok ? 'pass' : 'fail'}">${ico(ok ? I.check : I.cross)}<span>${k}</span></li>`).join('') + (win ? '<li class="win">Tantangan selesai. Coba tantangan berikutnya.</li>' : '');
    kick();
  }
  function advice() {
    const kidsOf = id => g.edges.filter(e => e[0] === id);
    const dead = g.nodes.find(n => !TERMINAL.has(n.type) && !kidsOf(n.id).length && sim.st[n.id].in > 0);
    if (dead) return `${dead.name} tidak tersambung ke mana pun, jadi request yang sampai di sana hilang. Sambungkan ke komponen berikutnya.`;
    const worst = g.nodes.filter(n => isFinite(n.cap)).sort((a, b) => sim.st[b.id].rho - sim.st[a.id].rho)[0];
    if (worst && sim.st[worst.id].rho > 1) {
      const s = sim.st[worst.id], base = `${worst.name} menerima ${fmt(s.in)} rps, padahal kapasitasnya ${fmt(worst.cap)}.`;
      return base + ({server: ' Tambah server di belakang load balancer.', db: ' Pasang cache di depannya atau naikkan kapasitasnya.', lb: ' Tambah load balancer kedua atau naikkan kapasitasnya.'}[worst.type] || ' Naikkan kapasitasnya.');
    }
    if (sim.backlog > 0) return `Antrean bertambah ${fmt(sim.backlog)} pesan per detik. Tidak ada yang ditolak, tapi tambah worker agar antrean tidak menumpuk selamanya.`;
    if (worst && sim.st[worst.id].rho > .8) return `${worst.name} bekerja di ${pct(sim.st[worst.id].rho)} kapasitas. Latensi mulai naik tajam di atas 80%.`;
    return 'Semua komponen sehat. Naikkan trafik untuk mencari batasnya.';
  }

  function renderInspector() {
    const opts = g.nodes.map(n => `<option value="${n.id}"${n === sel ? ' selected' : ''}>${esc(n.name)}</option>`).join('');
    const pick = `<label class="fld-col" style="margin-top:0">Pilih komponen<select id="pg-sel"><option value="">Belum ada yang dipilih</option>${opts}</select></label>`;
    if (!sel) { $('#pg-insp').innerHTML = `<h2>Komponen</h2>${pick}<p class="muted" style="margin-top:10px;font-size:13.5px">Klik komponen di kanvas atau pilih dari daftar untuk mengatur kapasitas dan sambungannya.</p>`; return; }
    const base = PG[sel.type], outs = g.edges.filter(e => e[0] === sel.id).map(e => byId(e[1]));
    const cands = g.nodes.filter(n => canLink(sel, n));
    $('#pg-insp').innerHTML = `<h2>${esc(sel.name)}</h2><p class="muted tech-ex">Contoh: ${techOf(sel.type)}</p>${pick}
      ${isFinite(sel.cap) ? `<label class="fld-col">Kapasitas<output id="pg-cap-out" class="num">${fmt(sel.cap)} rps</output><input id="pg-cap" type="range" min="${base.cap * .5}" max="${base.cap * 4}" step="${base.cap * .25}" value="${sel.cap}"></label>` : ''}
      ${sel.hit != null ? `<label class="fld-col">Hit rate<output id="pg-hit-out" class="num">${pct(sel.hit)}</output><input id="pg-hit" type="range" min="0" max=".99" step=".01" value="${sel.hit}"></label>` : ''}
      <p class="lbl-s" style="margin-top:14px">Mengirim ke</p>
      <ul class="conns">${outs.length ? outs.map(n => `<li>${esc(n.name)}<button class="btn ghost sm" data-unlink="${n.id}">Putuskan</button></li>`).join('') : '<li class="muted">Belum ada sambungan</li>'}</ul>
      ${cands.length ? `<label class="fld-col">Sambungkan ke<select id="pg-link"><option value="">Pilih tujuan</option>${cands.map(n => `<option value="${n.id}">${esc(n.name)}</option>`).join('')}</select></label>` : ''}
      <button class="btn" id="pg-del">Hapus komponen</button>`;
  }
  function graphChanged() { packets = []; acc = g.edges.map(() => 0); renderInspector(); recompute(); }
  function setHint() {
    $('#pg-hint').textContent = connecting ? (from ? `Klik komponen tujuan untuk ${from.name}. Tekan Esc untuk batal.` : 'Mode sambung: klik komponen asal, lalu komponen tujuan.') : 'Seret komponen untuk memindahkan. Klik untuk memilih.';
    cv.classList.toggle('connecting', connecting);
  }
  function setRun() { const b = $('#pg-run'); b.setAttribute('aria-pressed', running); b.innerHTML = ico(running ? I.pause : I.play) + (running ? 'Jeda' : 'Jalankan'); }

  /* drawing */
  function draw(dt) {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    g.edges.forEach(([a, b], i) => {
      const A = byId(a), B = byId(b), f = sim.edgeFlow[a + '>' + b] || 0;
      ctx.strokeStyle = f ? pal.ink2 : pal.edge; ctx.lineWidth = 1.5 + Math.min(4, f / 2500);
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
      ctx.save(); ctx.translate((A.x + B.x) / 2, (A.y + B.y) / 2); ctx.rotate(Math.atan2(B.y - A.y, B.x - A.x));
      ctx.fillStyle = f ? pal.ink2 : pal.edge; ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.fill(); ctx.restore();
      acc[i] += dt / 1000 * Math.min(f / 120, 28); // laju visual dibatasi, bukan 1 titik per request
      while (acc[i] >= 1 && packets.length < 500) { acc[i]--; packets.push({i, k: 0, len: Math.hypot(B.x - A.x, B.y - A.y)}); }
      acc[i] %= 1;
    });
    ctx.fillStyle = pal.ink;
    let w = 0;
    for (const p of packets) {
      p.k += dt * .32 / p.len;
      const e = g.edges[p.i]; if (p.k >= 1 || !e) continue;
      const A = byId(e[0]), B = byId(e[1]);
      ctx.beginPath(); ctx.arc(A.x + (B.x - A.x) * p.k, A.y + (B.y - A.y) * p.k, 3.5, 0, 6.283); ctx.fill();
      packets[w++] = p;
    }
    packets.length = w;
    g.nodes.forEach(n => {
      const d = sim.st[n.id].drop;
      if (d > 0 && dt) { n._s = (n._s || 0) + dt / 1000 * Math.min(d / 80, 30); while (n._s >= 1 && sparks.length < 160) { n._s--; sparks.push({x: n.x + NW / 2 - 8, y: n.y - NH / 2 + 6, vx: .04 + Math.random() * .08, vy: -.08 - Math.random() * .06, life: 1}); } }
    });
    ctx.fillStyle = pal.bad;
    w = 0;
    for (const s of sparks) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += .0005 * dt; s.life -= dt / 700;
      if (s.life <= 0) continue;
      ctx.globalAlpha = s.life; ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, 6.283); ctx.fill();
      sparks[w++] = s;
    }
    sparks.length = w; ctx.globalAlpha = 1;
    g.nodes.forEach(drawNode);
    if (connecting && from && pointer) {
      ctx.setLineDash([6, 6]); ctx.strokeStyle = pal.focus; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  function drawNode(n) {
    const s = sim.st[n.id], x = n.x - NW / 2, y = n.y - NH / 2, col = pal.t[n.type], active = n === sel || n === from;
    ctx.beginPath(); ctx.roundRect(x, y, NW, NH, n.type === 'client' ? NH / 2 : 9);
    ctx.fillStyle = pal.surface; ctx.fill();
    ctx.lineWidth = active ? 3 : 2; ctx.strokeStyle = active ? pal.focus : col; ctx.stroke();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x + 16, y + 17, 4.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = pal.ink; ctx.font = '700 13px Overpass, system-ui, sans-serif'; ctx.textBaseline = 'middle';
    ctx.fillText(n.name, x + 27, y + 18);
    ctx.font = '600 11.5px Overpass, system-ui, sans-serif';
    const sub = n.type === 'client' ? `${short(rps)} rps keluar` : s.backlog > 0 ? `antre +${short(s.backlog)}/dtk` : `${short(s.in)} / ${short(n.cap)} rps`;
    ctx.fillStyle = s.rho > 1 ? pal.bad : pal.ink2; ctx.fillText(sub, x + 14, y + 35);
    if (isFinite(n.cap)) {
      ctx.fillStyle = pal.sunk; ctx.fillRect(x + 14, y + NH - 10, NW - 28, 4);
      ctx.fillStyle = s.rho > 1 ? pal.bad : s.rho > .8 ? pal.warn : pal.ok;
      ctx.fillRect(x + 14, y + NH - 10, (NW - 28) * Math.min(1, s.rho), 4);
    }
  }
  function tick(now) {
    raf = 0;
    const dt = running ? Math.max(0, Math.min(now - last, 50)) : 0; last = now;
    draw(dt);
    if (running && visible) raf = requestAnimationFrame(tick);
  }
  // Satu loop saja; saat dijeda kanvas hanya digambar ulang ketika ada perubahan.
  function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }

  function resize() {
    const w = wrap.clientWidth; dpr = Math.min(devicePixelRatio || 1, 2); scale = w / W;
    cv.width = Math.round(w * dpr); cv.height = Math.round(w * H / W * dpr); cv.style.height = `${w * H / W}px`;
    kick();
  }
  const toWorld = e => { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H}; };
  const hit = p => { for (let i = g.nodes.length - 1; i >= 0; i--) { const n = g.nodes[i]; if (Math.abs(p.x - n.x) <= NW / 2 && Math.abs(p.y - n.y) <= NH / 2) return n; } return null; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  cv.onpointerdown = e => {
    const p = toWorld(e), n = hit(p);
    if (connecting) {
      if (!n) { from = null; }
      else if (!from) from = n;
      else { if (canLink(from, n)) { g.edges.push([from.id, n.id]); sel = from; graphChanged(); } from = null; }
      setHint(); kick(); return;
    }
    sel = n; renderInspector();
    if (n) { drag = {n, dx: p.x - n.x, dy: p.y - n.y}; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; }
    kick();
  };
  cv.onpointermove = e => {
    pointer = toWorld(e);
    if (drag) { drag.n.x = clamp(pointer.x - drag.dx, NW / 2, W - NW / 2); drag.n.y = clamp(pointer.y - drag.dy, NH / 2, H - NH / 2); packets = []; kick(); }
    else if (connecting && from) kick();
  };
  cv.onpointerup = () => { drag = null; cv.style.cursor = ''; };
  const onKey = e => {
    if (e.key === 'Escape' && connecting) { connecting = false; from = null; $('#pg-connect').setAttribute('aria-pressed', false); setHint(); kick(); }
  };
  addEventListener('keydown', onKey);

  view.onclick = e => {
    const add = e.target.closest('[data-add]');
    if (add) {
      const k = g.nodes.length;
      const n = mkNode(add.dataset.add, 120 + (k * 97) % 660, 70 + (k * 61) % 380, g);
      g.nodes.push(n); sel = n; graphChanged(); return;
    }
    const un = e.target.closest('[data-unlink]');
    if (un) { g.edges = g.edges.filter(([a, b]) => !(a === sel.id && b === un.dataset.unlink)); graphChanged(); return; }
    if (e.target.closest('#pg-del') && sel) { g.edges = g.edges.filter(([a, b]) => a !== sel.id && b !== sel.id); g.nodes = g.nodes.filter(n => n !== sel); sel = null; graphChanged(); return; }
    if (e.target.closest('#pg-run')) { running = !running; setRun(); kick(); return; }
    if (e.target.closest('#pg-connect')) { connecting = !connecting; from = null; $('#pg-connect').setAttribute('aria-pressed', connecting); setHint(); kick(); }
  };
  view.oninput = e => {
    const t = e.target;
    if (t.id === 'pg-rps') { rps = +t.value; recompute(); }
    else if (t.id === 'pg-cap') { sel.cap = +t.value; $('#pg-cap-out').textContent = `${fmt(sel.cap)} rps`; recompute(); }
    else if (t.id === 'pg-hit') { sel.hit = +t.value; $('#pg-hit-out').textContent = pct(sel.hit); recompute(); }
  };
  view.onchange = e => {
    const t = e.target;
    if (t.id === 'pg-preset') { g = PRESETS[t.value].build(); sel = null; from = null; graphChanged(); history.replaceState(null, '', `#/playground/${t.value}`); }
    else if (t.id === 'pg-sel') { sel = byId(t.value) || null; renderInspector(); kick(); $('#pg-sel')?.focus(); }
    else if (t.id === 'pg-link' && t.value) { g.edges.push([sel.id, t.value]); graphChanged(); $('#pg-link')?.focus(); }
    else if (t.id === 'pg-chal') { chal = +t.value; rps = CHALLENGES[chal].rps; $('#pg-rps').value = rps; recompute(); }
  };

  const onTheme = () => { readPal(); kick(); };
  addEventListener('themechange', onTheme);
  const ro = new ResizeObserver(resize); ro.observe(wrap);
  const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible) kick(); }); io.observe(cv);
  readPal(); setRun(); setHint(); graphChanged(); resize();
  document.fonts?.ready.then(kick);
  return () => { cancelAnimationFrame(raf); raf = -1; ro.disconnect(); io.disconnect(); removeEventListener('keydown', onKey); removeEventListener('themechange', onTheme); view.onclick = view.oninput = view.onchange = null; };
}

/* ---------- Design system ---------- */
function viewDesign() {
  const sw = (v, name, use) => `<div class="sw"><i style="--v:var(${v})"></i><div><b>${name}</b><code data-var="${v}"></code><br><span class="muted" style="font-size:12.5px">${use}</span></div></div>`;
  const motion = [['--t-fast', '120 ms', 'Hover, tekan tombol, ganti warna chip'], ['--t-med', '220 ms', 'Ganti tab, highlight node di langkah baru'], ['Paket per hop', '1.100 ms, linear', 'Kecepatan data harus konstan agar mata bisa mengikuti'], ['Langkah animasi', '6 detik', 'Cukup untuk membaca caption satu sampai dua kalimat'], ['Kereta di peta', '13–21 detik', 'Gerak latar paling lambat, berhenti saat peta keluar layar']];
  view.innerHTML = `<div class="ds">
    <header class="page-head"><h1>Sistem desain Alur</h1><p>Token, komponen, dan aturan gerak yang dipakai di seluruh aplikasi. Bahasa visualnya diambil dari peta transit: setiap topik adalah garis berwarna, setiap pelajaran adalah stasiun.</p></header>
    <section><h2>Prinsip</h2><p class="intro">Tiga aturan yang dipakai untuk memutuskan setiap detail.</p><div class="princ">
      <div style="--cat:var(--c-fondasi)"><b>Gerak menjelaskan, bukan menghias</b><p>Setiap animasi menggambarkan data yang berpindah. Gerakan yang tidak mewakili request, pesan, atau perubahan state dihapus.</p></div>
      <div style="--cat:var(--c-cache)"><b>Garis adalah topik</b><p>Warna hanya dipakai untuk kategori dan status, sehingga mata belajar membaca warna sebagai informasi.</p></div>
      <div style="--cat:var(--c-msg)"><b>Diam sampai diminta</b><p>Thumbnail bergerak saat disorot, pemutar berhenti saat keluar layar. Ratusan kartu tidak berarti ratusan animasi berjalan.</p></div></div></section>

  const cs = getComputedStyle(root);

function checkDiagram(d) {
  const e = [];
  if (!d || typeof d !== 'object' || !Array.isArray(d.nodes) || !d.nodes.length) return ['"nodes" harus berisi minimal satu node.'];
  const ids = new Set();
  d.nodes.forEach((n, i) => {
    if (!Array.isArray(n) || n.length !== 5) return e.push(`Node ${i + 1}: format harus [id, tipe, x, y, label].`);
    const [id, t, x, y, lb] = n;
    if (!/^\w+$/.test(id) || ids.has(id)) e.push(`Node ${i + 1}: id "${id}" kosong, tidak valid, atau dobel.`);
    if (!Object.hasOwn(TYPES, t)) e.push(`Node ${id}: tipe "${t}" tidak dikenal. Pilih: ${Object.keys(TYPES).join(', ')}.`);
    if (!(x >= 0 && x <= 320 && y >= 0 && y <= 180)) e.push(`Node ${id}: x harus 0–320 dan y 0–180.`);
    if (typeof lb !== 'string' || !lb.trim() || lb.length > 24) e.push(`Node ${id}: label wajib, maksimal 24 huruf.`);
    ids.add(id);
  });
  const pair = (v, sep) => { if (typeof v !== 'string') return false; const [a, b, ...rest] = v.replace(/^!/, '').split(sep); return !rest.length && ids.has(a) && ids.has(b); };
  if (!Array.isArray(d.edges) || !d.edges.every(x => pair(x, '-'))) e.push('"edges": setiap edge berbentuk "a-b" dengan id node yang ada.');
  if (!Array.isArray(d.steps) || !d.steps.length || d.steps.length > 12) e.push('"steps" harus berisi 1–12 langkah.');
  else d.steps.forEach((s, i) => {
    if (!s || typeof s.t !== 'string' || !s.t.trim() || typeof s.d !== 'string' || !s.d.trim()) e.push(`Langkah ${i + 1}: "t" (judul) dan "d" (caption) wajib diisi.`);
    if (!Array.isArray(s?.f) || !s.f.every(x => pair(x, '>'))) e.push(`Langkah ${i + 1}: "f" berisi aliran "a>b" (awalan ! = gagal).`);
    else if (!s.f.every(x => { const {a, b} = parseFlow(x); return d.edges?.includes(`${a}-${b}`) || d.edges?.includes(`${b}-${a}`); })) e.push(`Langkah ${i + 1}: setiap aliran di "f" harus melewati edge yang ada.`);
    ['h', 'x'].forEach(k => { if (s?.[k] != null && (!Array.isArray(s[k]) || !s[k].every(id => ids.has(id)))) e.push(`Langkah ${i + 1}: "${k}" berisi id node.`); });
    if (s?.cut != null && (!Array.isArray(s.cut) || !s.cut.every(x => d.edges?.includes(x)))) e.push(`Langkah ${i + 1}: "cut" berisi edge yang ada.`);
  });
  const q = d.quiz;
  if (!q || typeof q.q !== 'string' || !q.q.trim() || !Array.isArray(q.o) || q.o.length < 2 || !q.o.every(o => typeof o === 'string' && o.trim()) || !Number.isInteger(q.a) || q.a < 0 || q.a >= q.o.length)
    e.push('"quiz" butuh "q" (pertanyaan), "o" (minimal 2 pilihan), dan "a" (indeks jawaban benar, mulai 0).');
  return e;
}
function checkLesson(l, dgs) {
  const e = [];
  if (!/^[a-z0-9_]{1,20}$/.test(l.id)) e.push('ID hanya huruf kecil, angka, dan garis bawah (maksimal 20).');
  if (!l.t?.trim() || l.t.length > 80) e.push('Judul wajib, maksimal 80 huruf.');
  if (!l.s?.trim() || l.s.length > 24) e.push('Nama stasiun wajib, maksimal 24 huruf.');
  if (!Object.hasOwn(CAT, l.cat)) e.push('Pilih kategori.');
  if (![0, 1, 2].includes(l.lv)) e.push('Pilih tingkat kesulitan.');
  if (!Number.isInteger(l.min) || l.min < 1 || l.min > 120) e.push('Durasi 1–120 menit.');
  if (!Object.hasOwn(dgs, l.dg)) e.push('Pilih animasi.');
  if (!l.d?.trim()) e.push('Deskripsi wajib diisi.');
  if (!Array.isArray(l.p) || !l.p.length || !l.p.every(x => typeof x === 'string' && x.trim())) e.push('Tulis minimal satu poin kunci.');
  return e;
}
// Konten dari luar (localStorage atau database) dipakai hanya jika seluruhnya lolos validasi.
function useContent(lessons, dgs) {
  if (!Array.isArray(lessons) || !lessons.length || !dgs || Object.values(dgs).some(d => checkDiagram(d).length) || lessons.some(l => checkLesson(l, dgs).length)) return false;
  const copy = {...dgs}; // dgs bisa jadi DG itu sendiri
  L.splice(0, L.length, ...lessons);
  Object.keys(DG).forEach(k => delete DG[k]); Object.assign(DG, copy);
  return true;
}
if (!SB_ON) { try { const c = JSON.parse(localStorage.getItem('alur-content')); if (c) useContent(c.L, c.DG); } catch {} }

// Simpan seluruh konten sekaligus; sukses dulu baru diterapkan, jadi kegagalan jaringan tidak meninggalkan setengah perubahan.
// shortcut: menulis ulang semua baris (±40) setiap simpan, ganti dengan upsert per baris jika konten sudah ratusan.
async function saveContent(lessons, dgs) {
  if (auth.sb) {
    const sb = auth.sb;
    const [rl, rd] = await Promise.all([sb.from('lessons').select('id'), sb.from('diagrams').select('id')]);
    if (rl.error || rd.error) throw rl.error || rd.error;
    let r = await sb.from('diagrams').upsert(Object.entries(dgs).map(([id, data]) => ({id, data})));
    if (r.error) throw r.error;
    r = await sb.from('lessons').upsert(lessons.map((l, i) => ({id: l.id, data: l, sort: i})));
    if (r.error) throw r.error;
    const goneL = rl.data.map(x => x.id).filter(id => !lessons.some(l => l.id === id));
    const goneD = rd.data.map(x => x.id).filter(id => !dgs[id]);
    if (goneL.length && (r = await sb.from('lessons').delete().in('id', goneL)).error) throw r.error;
    if (goneD.length && (r = await sb.from('diagrams').delete().in('id', goneD)).error) throw r.error;
  } else localStorage.setItem('alur-content', JSON.stringify({L: lessons, DG: dgs}));
  useContent(lessons, dgs);
}

async function initAuth() {
  if (!SB_ON) return;
  const {createClient} = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
  const sb = auth.sb = createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth: {flowType: 'pkce'}});
  const [rl, rd] = await Promise.all([sb.from('lessons').select('data').order('sort'), sb.from('diagrams').select('id,data')]);
  if (!rl.error && !rd.error && rl.data.length) useContent(rl.data.map(x => x.data), Object.fromEntries(rd.data.map(x => [x.id, x.data])));
  const {data: {session}} = await sb.auth.getSession();
  await setUser(session?.user || null);
  // Panggilan Supabase di dalam callback bisa deadlock, jadi ditunda; render ulang hanya jika user benar-benar berganti.
  sb.auth.onAuthStateChange((_e, s) => { const u = s?.user || null; if (u?.id !== auth.user?.id) setTimeout(() => setUser(u).then(route)); });
}
async function setUser(u) {
  auth.user = u; auth.admin = false;
  if (u) { const {data} = await auth.sb.from('admins').select('user_id').eq('user_id', u.id).maybeSingle(); auth.admin = !!data; }
  renderAccount();
}

    : `<h2>Masuk ke Alur</h2><p class="muted">Masuk untuk mengelola konten jika kamu admin. Progres belajar tetap tersimpan di perangkat ini.</p>
       <div class="oauth"><button class="btn" data-login="google"${SB_ON ? '' : ' disabled'}>${ico(I.google)}Lanjutkan dengan Google</button><button class="btn" data-login="github"${SB_ON ? '' : ' disabled'}>${ico(I.github)}Lanjutkan dengan GitHub</button></div>
       ${SB_ON ? '' : '<p class="note">Login belum aktif di situs ini. Isi URL dan anon key Supabase di config.js untuk menyalakannya.</p>'}`;
  $$('.rail [data-r=admin]').forEach(a => a.hidden = !auth.admin);
}

      <label>Nama stasiun di peta<input type="text" name="s" value="${esc(l.s)}" maxlength="24" required><small>Pendek, tampil di bawah stasiun.</small></label>
      <div class="row"><label>Kategori<select name="cat">${CATS.map(c => opt(c.id, l.cat, c.name)).join('')}</select></label>
        <label>Tingkat<select name="lv">${LV.map((n, i) => opt(String(i), String(l.lv), n)).join('')}</select></label>
        <label>Durasi (menit)<input type="number" name="min" value="${l.min}" min="1" max="120"></label></div>
      <label>Animasi<select name="dg">${Object.keys(DG).map(k => opt(k, l.dg, `${k} (${DG[k].steps.length} langkah)`)).join('')}</select><small>Kuis ikut animasi yang dipilih. <a href="#/admin/d/new">Buat animasi baru</a></small></label>
      <label>Deskripsi<textarea name="d" rows="3" required>${esc(l.d)}</textarea></label>
      <label>Poin kunci<textarea name="p" rows="4">${esc(l.p.join('\n'))}</textarea><small>Satu poin per baris.</small></label>
      <div id="adm-err"></div>
      <div class="row"><button class="btn pri">Simpan pelajaran</button><a class="btn ghost" href="#/admin">Batal</a></div>
    </form><aside><p class="lbl-s">Pratinjau kartu</p><div class="adm-prev" inert></div></aside></div></div>`;
  const form = $('.adm-form', view);
  const read = () => { const f = new FormData(form); return {id: f.get('id').trim(), t: f.get('t').trim(), s: f.get('s').trim(), cat: f.get('cat'), lv: +f.get('lv'), min: +f.get('min'), dg: f.get('dg'), d: f.get('d').trim(), p: f.get('p').split('\n').map(x => x.trim()).filter(Boolean)}; };
  const preview = () => { const x = read(); if (Object.hasOwn(CAT, x.cat) && Object.hasOwn(DG, x.dg)) $('.adm-prev', view).innerHTML = cardHTML({...x, t: x.t || 'Judul pelajaran', id: x.id || 'new'}); };
  form.oninput = preview; preview();
  form.onsubmit = async e => {
    e.preventDefault();
    const x = read(), errs = checkLesson(x, DG);
    if (isNew && L.some(o => o.id === x.id)) errs.push(`ID “${x.id}” sudah dipakai.`);
    $('#adm-err').innerHTML = errList(errs);
    if (errs.length) return;
    let next;
    if (isNew) { const last = L.findLastIndex(o => o.cat === x.cat); next = [...L]; next.splice(last < 0 ? L.length : last + 1, 0, x); }
    else next = L.map(o => o === orig ? x : o);
    try { await saveContent(next, DG); location.hash = '#/admin'; }
    catch (err) { $('#adm-err').innerHTML = errList([`Gagal menyimpan: ${err.message || err}`]); }
  };
  return () => {};
}

function adminDiagram(id) {
  const isNew = id === 'new', orig = Object.hasOwn(DG, id) ? DG[id] : null;
  if (!isNew && !orig) { location.replace('#/admin'); return null; }
  view.innerHTML = `<div class="adm"><header class="page-head"><a href="#/admin" class="back">Kelola konten</a><h1>${isNew ? 'Tambah animasi' : `Ubah animasi ${esc(id)}`}</h1>
      <p>Animasi ditulis sebagai data: node, edge, dan langkah. Pratinjau di kanan langsung diperbarui saat kamu mengetik.</p></header>
    <div class="adm-edit wide"><form class="adm-form" novalidate>
      <label>ID<input type="text" name="id" value="${isNew ? '' : esc(id)}" ${isNew ? 'required pattern="[a-z0-9_]+" maxlength="20"' : 'readonly'}></label>
      <label>Data animasi (JSON)<textarea name="json" rows="18" spellcheck="false" class="code">${esc(fmtDG(orig || DG_TEMPLATE))}</textarea></label>
      <details class="help"><summary>Format data</summary><div class="kv">
        <code>nodes</code><span>[id, tipe, x, y, label]. Kanvas 320×180. Tipe: ${Object.keys(TYPES).join(', ')}.</span>
        <code>edges</code><span>Garis antar node, "a-b".</span>
        <code>steps[].t / d</code><span>Judul langkah dan caption.</span>
        <code>steps[].f</code><span>Aliran paket "a>b". Awalan "!" berarti request gagal di tengah jalan.</span>
        <code>steps[].h / x</code><span>Node yang disorot / node yang mati.</span>
        <code>steps[].cut</code><span>Edge yang terputus, misalnya partisi jaringan.</span>
        <code>quiz</code><span>{"q": pertanyaan, "o": [pilihan], "a": indeks jawaban benar mulai 0}.</span></div></details>
      <div id="adm-err"></div>
      <div class="row"><button class="btn pri">Simpan animasi</button><a class="btn ghost" href="#/admin">Batal</a></div>
    </form><aside><p class="lbl-s">Pratinjau</p><div class="adm-player"></div></aside></div></div>`;
  const form = $('.adm-form', view), box = $('.adm-player', view);
  let player = null, timer = 0;
  function parse() { try { const d = JSON.parse(form.elements.json.value); return {d, errs: checkDiagram(d)}; } catch (err) { return {d: null, errs: [`JSON tidak valid: ${err.message}`]}; } }
  function preview() {
    const {d, errs} = parse();
    $('#adm-err').innerHTML = errList(errs);
    if (errs.length) return;
    player?.destroy();
    box.innerHTML = playerHTML(d);
    player = mountPlayer($('.player', box), d, () => {});
  }
  form.oninput = e => { if (e.target.name === 'json') { clearTimeout(timer); timer = setTimeout(preview, 400); } };
  preview();
  form.onsubmit = async e => {
    e.preventDefault();
    const key = form.elements.id.value.trim(), {d, errs} = parse();
    if (!/^[a-z0-9_]{1,20}$/.test(key)) errs.push('ID hanya huruf kecil, angka, dan garis bawah (maksimal 20).');
    if (isNew && Object.hasOwn(DG, key)) errs.push(`ID “${key}” sudah dipakai.`);
    $('#adm-err').innerHTML = errList(errs);
    if (errs.length) return;
    try { await saveContent(L, {...DG, [key]: d}); location.hash = '#/admin'; }
    catch (err) { $('#adm-err').innerHTML = errList([`Gagal menyimpan: ${err.message || err}`]); }
  };
  return () => { clearTimeout(timer); player?.destroy(); };
}

/* ---------- Shell ---------- */
$('.rail').innerHTML = [['home', '#/', I.home, 'Beranda'], ['playground', '#/playground', I.nodes, 'Playground'], ['saved', '#/saved', I.bookmark, 'Disimpan'], ['design', '#/design', I.swatch, 'Desain'], ['admin', '#/admin', I.gear, 'Admin']]
  .map(([k, h, i, n]) => `<a href="${h}" data-r="${k}">${ico(i)}${n}</a>`).join('');

let cleanup = null;
function route() {
  cleanup?.(); cleanup = null;
  const h = location.hash || '#/';
  let m, section = 'home';
  if ((m = h.match(/^#\/l\/(\w+)$/))) cleanup = viewLesson(m[1]);
  else if ((m = h.match(/^#\/playground(?:\/(\w+))?$/))) { cleanup = viewPlayground(m[1]); section = 'playground'; }
  else if (h === '#/design') { cleanup = viewDesign(); section = 'design'; }
  else if ((m = h.match(/^#\/admin(?:\/([ld])\/(\w+))?$/))) { cleanup = viewAdmin(m[1], m[2]); section = 'admin'; }
  else if (h === '#/saved') { cleanup = viewHome(true); section = 'saved'; }
  else cleanup = viewHome(false);
  $$('.rail a').forEach(a => a.dataset.r === section ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  scrollTo(0, 0);
}
addEventListener('hashchange', route);

const q = $('#q');
q.addEventListener('input', () => {
  F.q = q.value;
  if (refreshGrid) refreshGrid(); else location.hash = '#/';
});
addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
});

document.addEventListener('click', e => {
  if (e.target.closest('[data-open-acct]')) return $('#acct-dlg').showModal();
  const b = e.target.closest('[data-save]'); if (!b) return;
  const id = b.dataset.save, s = store.s.saved, i = s.indexOf(id);
  i < 0 ? s.push(id) : s.splice(i, 1); store.save();
  $$(`[data-save="${id}"]`).forEach(x => { x.setAttribute('aria-pressed', i < 0); const t = $('.lbl', x); if (t) t.textContent = i < 0 ? 'Disimpan' : 'Simpan'; });
  if (location.hash === '#/saved') refreshGrid?.();
});

function applyTheme(t) { t ? root.dataset.theme = t : delete root.dataset.theme; dispatchEvent(new Event('themechange')); }
$('#theme').onclick = () => {
  const cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  store.s.theme = cur === 'dark' ? 'light' : 'dark'; store.save(); applyTheme(store.s.theme);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => dispatchEvent(new Event('themechange')));
applyTheme(store.s.theme);
renderAccount();
(SB_ON ? initAuth().catch(err => console.error('Supabase:', err)) : Promise.resolve()).then(route);
</script>
</body>
</html>
