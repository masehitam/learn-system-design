function checkDiagram(d) {
  const e = [];
  if (!d || typeof d !== 'object' || !Array.isArray(d.nodes) || !d.nodes.length) return ['"nodes" harus berisi minimal satu node.'];
  const ids = new Set();
  d.nodes.forEach((n, i) => {
    if (!Array.isArray(n) || n.length !== 5) return e.push(`Node ${i + 1}: format harus [id, tipe, x, y, label].`);
    const [id, t, x, y, lb] = n;
    if (!/^\w+$/.test(id) || ids.has(id)) e.push(`Node ${i + 1}: id "${id}" kosong, tidak valid, atau dobel.`);
    if (!Object.hasOwn(TYPES, t)) e.push(`Node ${id}: tipe "${t}" tidak dikenal. Pilih: ${Object.keys(TYPES).join(', ')}.`);
    if (!(x >= 0 && x <= 320 && y >= 0 && y <= 180)) e.push(`Node ${id}: x harus 0–320 dan y 0–180.`);
    if (typeof lb !== 'string' || !lb.trim() || lb.length > 24) e.push(`Node ${id}: label wajib, maksimal 24 huruf.`);
    ids.add(id);
  });
  const pair = (v, sep) => { if (typeof v !== 'string') return false; const [a, b, ...rest] = v.replace(/^!/, '').split(sep); return !rest.length && ids.has(a) && ids.has(b); };
  if (!Array.isArray(d.edges) || !d.edges.every(x => pair(x, '-'))) e.push('"edges": setiap edge berbentuk "a-b" dengan id node yang ada.');
  if (!Array.isArray(d.steps) || !d.steps.length || d.steps.length > 12) e.push('"steps" harus berisi 1–12 langkah.');
  else d.steps.forEach((s, i) => {
    if (!s || typeof s.t !== 'string' || !s.t.trim() || typeof s.d !== 'string' || !s.d.trim()) e.push(`Langkah ${i + 1}: "t" (judul) dan "d" (caption) wajib diisi.`);
    if (!Array.isArray(s?.f) || !s.f.every(x => pair(x, '>'))) e.push(`Langkah ${i + 1}: "f" berisi aliran "a>b" (awalan ! = gagal).`);
    else if (!s.f.every(x => { const {a, b} = parseFlow(x); return d.edges?.includes(`${a}-${b}`) || d.edges?.includes(`${b}-${a}`); })) e.push(`Langkah ${i + 1}: setiap aliran di "f" harus melewati edge yang ada.`);
    ['h', 'x'].forEach(k => { if (s?.[k] != null && (!Array.isArray(s[k]) || !s[k].every(id => ids.has(id)))) e.push(`Langkah ${i + 1}: "${k}" berisi id node.`); });
    if (s?.cut != null && (!Array.isArray(s.cut) || !s.cut.every(x => d.edges?.includes(x)))) e.push(`Langkah ${i + 1}: "cut" berisi edge yang ada.`);
  });
  const q = d.quiz;
  if (!q || typeof q.q !== 'string' || !q.q.trim() || !Array.isArray(q.o) || q.o.length < 2 || !q.o.every(o => typeof o === 'string' && o.trim()) || !Number.isInteger(q.a) || q.a < 0 || q.a >= q.o.length)
    e.push('"quiz" butuh "q" (pertanyaan), "o" (minimal 2 pilihan), dan "a" (indeks jawaban benar, mulai 0).');
  return e;
}
// Format teks kuis di admin: "? soal", "- pilihan", "* pilihan benar", "> penjelasan", soal dipisah baris kosong.
function parseQuiz(text) {
  const qz = []; let cur = null;
  for (const raw of text.split('\n')) {
    const line = raw.trim(); if (!line) continue;
    const tag = line[0], val = line.slice(1).trim();
    if (tag === '?') qz.push(cur = {q: val, o: [], a: -1});
    else if (!cur) return {err: 'Mulai setiap soal dengan baris "? pertanyaan".'};
    else if (tag === '-' || tag === '*') {
      if (tag === '*') { if (cur.a >= 0) return {err: `Soal “${cur.q}” punya lebih dari satu jawaban benar.`}; cur.a = cur.o.length; }
      cur.o.push(val);
    } else if (tag === '>') cur.e = val;
    else return {err: `Baris “${line}” tidak dikenali. Awali dengan ?, -, *, atau >.`};
  }
  const miss = qz.find(q => q.a < 0);
  return miss ? {err: `Soal “${miss.q}” belum punya jawaban benar. Tandai dengan *.`} : {qz};
}
const fmtQuiz = qz => (qz || []).map(q => [`? ${q.q}`, ...q.o.map((o, i) => `${i === q.a ? '*' : '-'} ${o}`), ...(q.e ? [`> ${q.e}`] : [])].join('\n')).join('\n\n');
(function quizSelfTest() {
  const t = '? Satu?\n- a\n* b\n> karena b\n\n? Dua?\n* x\n- y';
  const r = parseQuiz(t);
  console.assert(r.qz?.length === 2 && r.qz[0].a === 1 && r.qz[0].e === 'karena b' && fmtQuiz(r.qz) === t, 'kuis: format teks bolak-balik');
  console.assert(parseQuiz('? a\n- x\n- y').err && parseQuiz('- x').err && parseQuiz('? a\n* x\n* y').err, 'kuis: format salah ditolak');
})();
function checkLesson(l, dgs) {
  const e = [];
  if (!/^[a-z0-9_]{1,20}$/.test(l.id)) e.push('ID hanya huruf kecil, angka, dan garis bawah (maksimal 20).');
  if (!l.t?.trim() || l.t.length > 80) e.push('Judul wajib, maksimal 80 huruf.');
  if (!l.s?.trim() || l.s.length > 24) e.push('Nama stasiun wajib, maksimal 24 huruf.');
  if (!Object.hasOwn(CAT, l.cat)) e.push('Pilih kategori.');
  if (![0, 1, 2].includes(l.lv)) e.push('Pilih tingkat kesulitan.');
  if (!Number.isInteger(l.min) || l.min < 1 || l.min > 120) e.push('Durasi 1–120 menit.');
  if (!Object.hasOwn(dgs, l.dg)) e.push('Pilih animasi.');
  if (!l.d?.trim()) e.push('Deskripsi wajib diisi.');
  if (!Array.isArray(l.p) || !l.p.length || !l.p.every(x => typeof x === 'string' && x.trim())) e.push('Tulis minimal satu poin kunci.');
  const okQ = q => q && typeof q === 'object' && typeof q.q === 'string' && q.q.trim() && Array.isArray(q.o) && q.o.length >= 2 && q.o.length <= 4
    && q.o.every(o => typeof o === 'string' && o.trim()) && Number.isInteger(q.a) && q.a >= 0 && q.a < q.o.length && (q.e == null || typeof q.e === 'string');
  if (l.qz != null && (!Array.isArray(l.qz) || l.qz.length < 3 || l.qz.length > 5 || !l.qz.every(okQ)))
    e.push('Kuis berisi 3–5 soal. Setiap soal punya 2–4 pilihan dengan tepat satu jawaban benar (*).');

}

// Simpan seluruh konten sekaligus; sukses dulu baru diterapkan, jadi kegagalan jaringan tidak meninggalkan setengah perubahan.
// shortcut: menulis ulang semua baris (±40) setiap simpan, ganti dengan upsert per baris jika konten sudah ratusan.
async function saveContent(lessons, dgs) {
  if (auth.sb) {
    const sb = auth.sb;
    const [rl, rd] = await Promise.all([sb.from('lessons').select('id'), sb.from('diagrams').select('id')]);
    if (rl.error || rd.error) throw rl.error || rd.error;
    let r = await sb.from('diagrams').upsert(Object.entries(dgs).map(([id, data]) => ({id, data})));
    if (r.error) throw r.error;
    r = await sb.from('lessons').upsert(lessons.map((l, i) => ({id: l.id, data: l, sort: i})));
    if (r.error) throw r.error;
    const goneL = rl.data.map(x => x.id).filter(id => !lessons.some(l => l.id === id));
    const goneD = rd.data.map(x => x.id).filter(id => !dgs[id]);
    if (goneL.length && (r = await sb.from('lessons').delete().in('id', goneL)).error) throw r.error;
    if (goneD.length && (r = await sb.from('diagrams').delete().in('id', goneD)).error) throw r.error;
  } else localStorage.setItem('alur-content', JSON.stringify({L: lessons, DG: dgs}));
  useContent(lessons, dgs);
}

  for (const key of ['quiz', 'chal']) if (isObj(d[key])) for (const [k, v] of Object.entries(d[key])) if (typeof v === 'boolean') o[key][k] = v;
  if (isObj(d.edits)) for (const [k, v] of Object.entries(d.edits)) if (isObj(v) && typeof v.t === 'number' && typeof v.on === 'boolean') o.edits[k] = {t: v.t, on: v.on};
  if (isObj(d.srs)) for (const [k, v] of Object.entries(d.srs)) if (isObj(v) && Number.isInteger(v.b) && v.b >= 0 && v.b < SRS_DAYS.length && typeof v.due === 'number' && typeof v.t === 'number') o.srs[k] = {b: v.b, due: v.due, t: v.t};
  // Kode desain hanya dicek bentuknya di sini; isinya divalidasi decodeDesign saat dibuka.
  if (isObj(d.designs)) for (const [k, v] of Object.entries(d.designs)) if (isObj(v) && typeof v.name === 'string' && v.name.trim() && v.name.length <= 60 && typeof v.code === 'string' && /^[\w-]{1,6000}$/.test(v.code) && [v.n, v.rps, v.t].every(x => Number.isFinite(x) && x >= 0)) o.designs[k] = {name: v.name, code: v.code, n: v.n, rps: v.rps, t: v.t};
  if (isObj(d.best)) for (const [k, v] of Object.entries(d.best)) if (isObj(v) && [v.cost, v.lat, v.t].every(x => Number.isFinite(x) && x >= 0)) o.best[k] = {cost: v.cost, lat: v.lat, t: v.t};

// Gabungan dua perangkat: progres tertinggi, simpanan dan catatan digabung, kuis/tantangan benar jika benar di salah satunya.
// Simpanan/catatan yang perubahan terakhirnya berupa hapus dibuang dari hasil gabungan.
// shortcut: memakai jam perangkat dan jejak edits tidak pernah dipangkas; cukup selama jumlahnya ratusan, bukan jutaan.
function mergeState(a, b) {
  const m = {progress: {...a.progress}, saved: [...new Set([...a.saved, ...b.saved])], notes: {...a.notes}, quiz: {...a.quiz}, chal: {...a.chal}, edits: {...a.edits}, srs: {...a.srs}, best: {...a.best}, designs: {...a.designs}};
  for (const [k, v] of Object.entries(b.progress)) m.progress[k] = Math.max(m.progress[k] || 0, v);
  for (const [k, list] of Object.entries(b.notes)) { const ids = new Set((m.notes[k] || []).map(n => n.id)); m.notes[k] = [...(m.notes[k] || []), ...list.filter(n => !ids.has(n.id))]; }
  for (const key of ['quiz', 'chal']) for (const [k, v] of Object.entries(b[key])) m[key][k] = m[key][k] || v;
  for (const [k, v] of Object.entries(b.best)) if (betterRun(v, m.best[k])) m.best[k] = v; // rekor terbaik menang
  for (const [k, v] of Object.entries(b.designs)) if (!m.designs[k] || v.t > m.designs[k].t) m.designs[k] = v;
  for (const key of ['edits', 'srs']) for (const [k, v] of Object.entries(b[key])) if (!m[key][k] || v.t > m[key][k].t) m[key][k] = v; // yang terakhir diubah menang
  const gone = k => m.edits[k]?.on === false;
  m.saved = m.saved.filter(id => !gone('s:' + id));
  for (const k in m.designs) if (gone('d:' + k)) delete m.designs[k];
  for (const k in m.notes) m.notes[k] = m.notes[k].filter(n => !gone(`n:${k}:${n.id}`));
  return m;
}

const sync = {
  status: '', timer: 0,
  setStatus(t) { this.status = t; const el = $('#sync-st'); if (el) el.textContent = t; },
  async pull() {
    const {data, error} = await auth.sb.from('user_state').select('data').eq('user_id', auth.user.id).maybeSingle();
    if (error) return this.setStatus('Progres belum tersinkron: ' + error.message);
    Object.assign(store.s, mergeState(cleanState(store.s), cleanState(data?.data)));
    store.save(); // menyimpan lokal dan mengirim hasil gabungan ke server
  },
  push() {
    if (!auth.user) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 1200);
  },
  async flush() {
    clearTimeout(this.timer); this.timer = 0;
    if (!auth.user) return;
    const data = Object.fromEntries(SYNC_KEYS.map(k => [k, store.s[k]]));
    const {error} = await auth.sb.from('user_state').upsert({user_id: auth.user.id, data, updated_at: new Date().toISOString()});
    this.setStatus(error ? 'Gagal menyinkronkan: ' + error.message + '. Data tetap aman di perangkat ini.' : 'Progres tersinkron dengan akunmu.');
  },
};

    e.preventDefault();
    const x = read(), pq = parseQuiz(x.qz);
    if (pq.qz?.length) x.qz = pq.qz; else delete x.qz;
    const errs = pq.err ? [pq.err] : checkLesson(x, DG);
    if (isNew && L.some(o => o.id === x.id)) errs.push(`ID “${x.id}” sudah dipakai.`);
    $('#adm-err').innerHTML = errList(errs);
    if (errs.length) return;
    let next;
    if (isNew) { const last = L.findLastIndex(o => o.cat === x.cat); next = [...L]; next.splice(last < 0 ? L.length : last + 1, 0, x); }
    else next = L.map(o => o === orig ? x : o);
    try { await saveContent(next, DG); location.hash = '#/admin'; }
    catch (err) { $('#adm-err').innerHTML = errList([`Gagal menyimpan: ${err.message || err}`]); }
  };
  return () => {};
}

function adminDiagram(id) {
  const isNew = id === 'new', orig = Object.hasOwn(DG, id) ? DG[id] : null;
  if (!isNew && !orig) { location.replace('#/admin'); return null; }
  view.innerHTML = `<div class="adm"><header class="page-head"><a href="#/admin" class="back">Kelola konten</a><h1>${isNew ? 'Tambah animasi' : `Ubah animasi ${esc(id)}`}</h1>
      <p>Animasi ditulis sebagai data: node, edge, dan langkah. Pratinjau di kanan langsung diperbarui saat kamu mengetik.</p></header>
    <div class="adm-edit wide"><form class="adm-form" novalidate>
      <label>ID<input type="text" name="id" value="${isNew ? '' : esc(id)}" ${isNew ? 'required pattern="[a-z0-9_]+" maxlength="20"' : 'readonly'}></label>
      <label>Data animasi (JSON)<textarea name="json" rows="18" spellcheck="false" class="code">${esc(fmtDG(orig || DG_TEMPLATE))}</textarea></label>
      <details class="help"><summary>Format data</summary><div class="kv">
        <code>nodes</code><span>[id, tipe, x, y, label]. Kanvas 320×180. Tipe: ${Object.keys(TYPES).join(', ')}.</span>
        <code>edges</code><span>Garis antar node, "a-b".</span>
        <code>steps[].t / d</code><span>Judul langkah dan caption.</span>
        <code>steps[].f</code><span>Aliran paket "a>b". Awalan "!" berarti request gagal di tengah jalan.</span>
        <code>steps[].h / x</code><span>Node yang disorot / node yang mati.</span>
        <code>steps[].cut</code><span>Edge yang terputus, misalnya partisi jaringan.</span>
        <code>quiz</code><span>{"q": pertanyaan, "o": [pilihan], "a": indeks jawaban benar mulai 0}.</span></div></details>
      <div id="adm-err"></div>
      <div class="row"><button class="btn pri">Simpan animasi</button><a class="btn ghost" href="#/admin">Batal</a></div>
    </form><aside><p class="lbl-s">Pratinjau</p><div class="adm-player"></div></aside></div></div>`;
  const form = $('.adm-form', view), box = $('.adm-player', view);
  let player = null, timer = 0;
  function parse() { try { const d = JSON.parse(form.elements.json.value); return {d, errs: checkDiagram(d)}; } catch (err) { return {d: null, errs: [`JSON tidak valid: ${err.message}`]}; } }
  function preview() {
    const {d, errs} = parse();
    $('#adm-err').innerHTML = errList(errs);
    if (errs.length) return;
    player?.destroy();
    box.innerHTML = playerHTML(d);
    player = mountPlayer($('.player', box), d, () => {});
  }
  form.oninput = e => { if (e.target.name === 'json') { clearTimeout(timer); timer = setTimeout(preview, 400); } };
  preview();
  form.onsubmit = async e => {
    e.preventDefault();
    const key = form.elements.id.value.trim(), {d, errs} = parse();
    if (!/^[a-z0-9_]{1,20}$/.test(key)) errs.push('ID hanya huruf kecil, angka, dan garis bawah (maksimal 20).');
    if (isNew && Object.hasOwn(DG, key)) errs.push(`ID “${key}” sudah dipakai.`);
    $('#adm-err').innerHTML = errList(errs);
    if (errs.length) return;
    try { await saveContent(L, {...DG, [key]: d}); location.hash = '#/admin'; }
    catch (err) { $('#adm-err').innerHTML = errList([`Gagal menyimpan: ${err.message || err}`]); }
  };
  return () => { clearTimeout(timer); player?.destroy(); };
}

/* ---------- Shell ---------- */
$('.rail').innerHTML = [['home', '#/', I.home, 'Beranda'], ['playground', '#/playground', I.nodes, 'Playground'], ['lab', '#/lab', I.flask, 'Lab'], ['saved', '#/saved', I.bookmark, 'Disimpan'], ['design', '#/design', I.swatch, 'Desain'], ['admin', '#/admin', I.gear, 'Admin']]
  .map(([k, h, i, n]) => `<a href="${h}" data-r="${k}">${ico(i)}${n}</a>`).join('');

let cleanup = null;
function route() {
  cleanup?.(); cleanup = null;
  const h = location.hash || '#/';
  let m, section = 'home';
  if ((m = h.match(/^#\/l\/(\w+)$/))) cleanup = viewLesson(m[1]);
  else if ((m = h.match(/^#\/playground\/share\/([\w-]+)$/))) { cleanup = viewPlayground(null, m[1]); section = 'playground'; }
  else if ((m = h.match(/^#\/playground(?:\/(\w+))?$/))) { cleanup = viewPlayground(m[1]); section = 'playground'; }
  else if ((m = h.match(/^#\/lab(?:\/(\w+))?$/))) { cleanup = viewLab(m[1]); section = 'lab'; }
  else if (h === '#/design') { cleanup = viewDesign(); section = 'design'; }
  else if ((m = h.match(/^#\/admin(?:\/([ld])\/(\w+))?$/))) { cleanup = viewAdmin(m[1], m[2]); section = 'admin'; }
  else if (h === '#/saved') { cleanup = viewHome(true); section = 'saved'; }
  else if (h === '#/ulang') cleanup = viewReview();
  else cleanup = viewHome(false);
  $$('.rail a').forEach(a => a.dataset.r === section ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  scrollTo(0, 0);
}
addEventListener('hashchange', route);

const q = $('#q');
let searchTimer = 0;
q.addEventListener('input', () => {
  F.q = q.value;
  clearTimeout(searchTimer);
  // Hanya panjang kueri dan jumlah hasil yang dicatat, bukan teksnya.
  if (F.q.trim()) searchTimer = setTimeout(() => track('search', {query_length: F.q.trim().length, results: L.filter(l => matches(l, false)).length}), 1000);
  if (refreshGrid) refreshGrid(); else location.hash = '#/';
});
addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
});

document.addEventListener('click', e => {
  if (e.target.closest('[data-open-acct]')) return $('#acct-dlg').showModal();
  const b = e.target.closest('[data-save]'); if (!b) return;
  const id = b.dataset.save, s = store.s.saved, i = s.indexOf(id);
  i < 0 ? s.push(id) : s.splice(i, 1); mark('s:' + id, i < 0); store.save(); track('save_toggle', {lesson_id: id, saved: i < 0});
  $$(`[data-save="${id}"]`).forEach(x => { x.setAttribute('aria-pressed', i < 0); const t = $('.lbl', x); if (t) t.textContent = i < 0 ? 'Disimpan' : 'Simpan'; });
  if (location.hash === '#/saved') refreshGrid?.();
});

function applyTheme(t) { t ? root.dataset.theme = t : delete root.dataset.theme; dispatchEvent(new Event('themechange')); }
$('#theme').onclick = () => {
  const cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  store.s.theme = cur === 'dark' ? 'light' : 'dark'; store.save(); applyTheme(store.s.theme);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => dispatchEvent(new Event('themechange')));
applyTheme(store.s.theme);
renderAccount();
track('session_start', {route: routeName()});
if ('serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker:', err));
(SB_ON ? initAuth().catch(err => console.error('Supabase:', err)) : Promise.resolve()).then(route);
</script>
</body>
</html>
